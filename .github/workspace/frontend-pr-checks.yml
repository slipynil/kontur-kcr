name: CI with Frontend Service

on:
  push:
    branches: ["main"]
    paths:
      - 'frontend/**'
  pull_request:
    branches: ["dev"]
    paths:
      - 'frontend/**'

defaults:
  run:
    working-directory: './frontend'

jobs:

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout service code
        uses: actions/checkout@v4

      # 2. Устанавливаем Node.js и включаем кэширование зависимостей
      #    Стек: Node v26.12, Next.js v16.4 (версия Next.js фиксируется в frontend/package.json)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.12'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      # 3. Установка зависимостей
      - name: Install dependencies
        run: npm ci

      # 4. Запуск линтера
      - name: Run ESLint
        run: npm run lint

      # 5. Проверяем, что Next.js приложение собирается
      - name: Build Next.js application
        run: npm run build

      # 6. Запуск тестов с покрытием
      - name: Run tests with coverage (Jest)
        run: npx jest --coverage --coverageReporters=text-summary --coverageReporters=json-summary

      # 7. Проверяем, что общее покрытие кода >= 90%
      - name: Check code coverage threshold
        run: |
          TOTAL_COVERAGE=$(node -e "const summary = require('./coverage/coverage-summary.json'); console.log(summary.total.statements.pct)")

          echo "Current code coverage: ${TOTAL_COVERAGE}%"

          awk -v cov="$TOTAL_COVERAGE" -v min="90.0" 'BEGIN {
              if (cov < min) {
                  print "❌ Error: Code coverage is " cov "%, which is below the required " min "%."
                  exit 1
              } else {
                  print "✅ Success: Code coverage " cov "% meets the requirement (" min "%)."
              }
          }'
