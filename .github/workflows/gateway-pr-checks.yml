name: CI with Gateway Service

on:
  push:
    # dev: мердж PR публикует образ; main — прямой пуш.
    branches: ["main", "dev"]
    paths:
      - 'services/gateway/**/*.go'
      - 'services/gateway/Dockerfile'
      - 'services/gateway/.dockerignore'
  pull_request:
    branches: ["dev"]
    paths:
      - 'services/gateway/**/*.go'
      - 'services/gateway/Dockerfile'
      - 'services/gateway/.dockerignore'

defaults:
  run:
    working-directory: './services/gateway'

jobs:

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout service code
        uses: actions/checkout@v4

      # 2. Устанавливаем Go и включаем кэширования зависимостей
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      # 3. Проверка зависимостей и сборка
      - name: Install dependencies
        run: go mod download

      # 3.5 Запуск линтера
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15
          working-directory: './services/gateway'

      # 4. Запуск тестов
      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out ./...

      # 5. Проверяем, что общее покрытие кода >= 90%
      - name: Check code coverage threshold
        run: |
          TOTAL_COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | sed 's/%//')

          echo "Current code coverage: ${TOTAL_COVERAGE}%"

          awk -v cov="$TOTAL_COVERAGE" -v min="90.0" 'BEGIN {
              if (cov < min) {
                  print "❌ Error: Code coverage is " cov "%, which is below the required " min "%."
                  exit 1
              } else {
                  print "✅ Success: Code coverage " cov "% meets the requirement (" min "%)."
              }
          }'

  # Создание docker image
  docker-build-and-push:
    # Образ публикуем только после зелёных lint/test и только на push:
    # публикация из PR перезаписывала бы тег latest до мерджа.
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # build-push-action НЕ приводит теги к нижнему регистру —
      # владелец репозитория обязан быть в нижнем регистре, иначе пуш упадёт
      - name: Lowercase repository owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # Логин нужен только при публикации; в PR образ собирается без пуша
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # PR: push=false — проверяем, что Dockerfile собирается, latest не трогаем.
      # Push: публикуем latest + неизменяемый тег по SHA коммита.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./services/gateway
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/kontur-kcr-gateway:latest
            ghcr.io/${{ env.OWNER_LC }}/kontur-kcr-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
