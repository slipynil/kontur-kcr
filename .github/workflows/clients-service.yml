name: Clients Service

on:
  push:
    paths:
      - services/clients/**
      - docs/api/**
      - docs/db/ddl/clients.sql
      - spec.md
      - .github/workflows/clients-service.yml
  pull_request:
    paths:
      - services/clients/**
      - docs/api/**
      - docs/db/ddl/clients.sql
      - spec.md
      - .github/workflows/clients-service.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/clients
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clients_test
          POSTGRES_PASSWORD: clients_test_local
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clients_test -d postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      CLIENTS_TEST_ADMIN_URL: postgresql+psycopg://clients_test:clients_test_local@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/clients/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/clients
    env:
      COMPOSE_PROJECT_NAME: clients-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: docker compose build
      - run: docker compose up --detach --wait --wait-timeout 120 clients
      - name: Check HTTP readiness and disabled business routes
        run: |
          python - <<'PY'
          import json
          from urllib.error import HTTPError
          from urllib.request import urlopen

          for path in ('/health/live', '/health/ready'):
              with urlopen('http://127.0.0.1:8000' + path, timeout=5) as response:
                  assert response.status == 200
                  assert json.load(response) == {'status': 'ok'}
          try:
              urlopen('http://127.0.0.1:8000/internal/v1/clients', timeout=5)
          except HTTPError as error:
              assert error.code == 404
          else:
              raise AssertionError('Business route unexpectedly enabled')
          PY
          test "$(docker compose exec -T clients id -u)" = '10001'
      - name: Logs
        if: always()
        run: docker compose logs --no-color migrate clients
      - name: Clean temporary CI containers and volume
        if: always()
        run: docker compose down --volumes --remove-orphans
