name: CI with Client History Service

on:
  push:
    # dev: мердж PR публикует образ; main — прямой пуш.
    branches: ["main", "dev"]
    paths:
      - 'services/client-history/**/*.py'
      - 'services/client-history/pyproject.toml'
      - 'services/client-history/poetry.lock'
      - 'services/client-history/Dockerfile'
      - 'services/client-history/.dockerignore'
      - '.github/workflows/client-history-service-pr-checks.yml'
  pull_request:
    branches: ["dev"]
    paths:
      - 'services/client-history/**/*.py'
      - 'services/client-history/pyproject.toml'
      - 'services/client-history/poetry.lock'
      - 'services/client-history/Dockerfile'
      - 'services/client-history/.dockerignore'
      - '.github/workflows/client-history-service-pr-checks.yml'

defaults:
  run:
    working-directory: './services/client-history'

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: client_history_test
          POSTGRES_PASSWORD: client_history_test_local
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U client_history_test -d postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # Тесты сами создают и удаляют временные базы, поэтому нужен админский URL.
      CLIENT_HISTORY_TEST_ADMIN_URL: postgresql+psycopg://client_history_test:client_history_test_local@127.0.0.1:5432/postgres

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout service code
        uses: actions/checkout@v4

      # 2. Устанавливаем Poetry (менеджер зависимостей проекта)
      - name: Install Poetry
        run: pipx install 'poetry==2.5.1'

      # 3. Устанавливаем Python и включаем кэширование зависимостей Poetry
      #    Стек: Python 3.14, Poetry, FastAPI, SQLAlchemy, Alembic, PostgreSQL, pytest
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'poetry'
          cache-dependency-path: 'services/client-history/poetry.lock'

      # 4. Установка зависимостей
      - name: Install dependencies
        run: poetry install --no-interaction

      # 5. Запуск линтера
      - name: Run Ruff
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      # 6. Запуск тестов с покрытием
      - name: Run tests with coverage (pytest)
        run: poetry run pytest -v --cov=client_history --cov-report=term --cov-report=json

      # 7. Проверяем, что общее покрытие кода >= 90%
      - name: Check code coverage threshold
        run: |
          TOTAL_COVERAGE=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")

          echo "Current code coverage: ${TOTAL_COVERAGE}%"

          awk -v cov="$TOTAL_COVERAGE" -v min="90.0" 'BEGIN {
              if (cov < min) {
                  print "❌ Error: Code coverage is " cov "%, which is below the required " min "%."
                  exit 1
              } else {
                  print "✅ Success: Code coverage " cov "% meets the requirement (" min "%)."
              }
          }'

  # Создание docker image
  docker-build-and-push:
    # Образ публикуем только после зелёных lint/test и только на push:
    # публикация из PR перезаписывала бы тег latest до мерджа.
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # build-push-action НЕ приводит теги к нижнему регистру —
      # владелец репозитория обязан быть в нижнем регистре, иначе пуш упадёт
      - name: Lowercase repository owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # Логин нужен только при публикации; в PR образ собирается без пуша
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # PR: push=false — проверяем, что Dockerfile собирается, latest не трогаем.
      # Push: публикуем latest + неизменяемый тег по SHA коммита.
      # Цель по умолчанию — runtime (последняя стадия Dockerfile).
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./services/client-history
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/kontur-kcr-client-history:latest
            ghcr.io/${{ env.OWNER_LC }}/kontur-kcr-client-history:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Деплой на dev-сервер (/srv/kontur): на сервере ничего не собирается —
  # pull уже опубликованных образов и up. Стек и настройка — server/README.md.
  deploy-to-dev-server:
    needs: docker-build-and-push
    # Пуш в dev — это мердж PR (PR открываются только в dev); main не деплоим.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # Мердж, задевающий несколько сервисов, запускает несколько деплоев;
    # общий group выстраивает их в очередь вместо гонки на сервере.
    concurrency:
      group: deploy-dev-server
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Compose-файл стека и SQL-миграции gateway кладём на сервер:
      # миграции не запечены в образ, а git-клона на сервере нет.
      # tar в scp-action сохраняет пути от корня репозитория, поэтому
      # получаем /srv/kontur/server/compose.yaml и
      # /srv/kontur/services/gateway/migrations — как ожидает compose.
      - name: Copy stack compose and gateway migrations to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "server/compose.yaml,services/gateway/migrations"
          target: "/srv/kontur"

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /srv/kontur
            docker compose --env-file server/.env -f server/compose.yaml pull
            docker compose --env-file server/.env -f server/compose.yaml up -d --remove-orphans
            docker image prune -f
