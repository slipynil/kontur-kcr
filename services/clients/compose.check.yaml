# Isolated HTTP checks only; do not use this override on a shared stand.
services:
  clients:
    environment:
      CLIENTS_ALLOW_UNAUTHENTICATED_LOCAL: 'true'
      CLIENTS_GATEWAY_SERVICE_TOKEN: ''
      CLIENTS_OPERATOR_WORK_SERVICE_TOKEN: ''
      CLIENTS_IMPORT_SERVICE_TOKEN: ''
      CLIENTS_ENABLE_REGISTRY_READ: 'true'
      CLIENTS_ENABLE_IMPORT_APPLY: 'true'
      CLIENTS_ENABLE_DATA_RECOVERY: 'true'
