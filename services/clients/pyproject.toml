[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "kontur-clients"
version = "0.1.0"
description = "Clients Service for Kontur KCR"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "SQLAlchemy==2.0.57",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.8",
    "pydantic-settings==2.16.2",
    "pydantic==2.14.3",
]

[tool.poetry]
packages = [{ include = "clients_service", from = "src" }]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-cov>=7,<8", "httpx==0.28.1", "ruff==0.17.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a dedicated empty PostgreSQL test database"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Preserve the frozen DDL verbatim, including its SQL comments.
"migrations/versions/0001_clients.py" = ["E501"]
