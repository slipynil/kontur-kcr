[project]
name = "operator-work"
version = "0.1.0"
description = "Operator assignments and reassignment requests"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.120,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.3,<4",
    "sqlalchemy>=2.0.44,<2.1",
    "tzdata>=2025.2",
    "uvicorn>=0.38,<1",
]

[tool.poetry.group.dev.dependencies]
pytest = ">=9,<10"
pytest-cov = ">=7,<8"
ruff = ">=0.14,<1"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100


[tool.ruff.lint.isort]
known-third-party = ["alembic"]
