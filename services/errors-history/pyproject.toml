[project]
name = "errors-history"
version = "0.1.0"
description = "Import error history for Kontur KCR"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.120,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0.44,<2.1",
    "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.14,<1"]

[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
