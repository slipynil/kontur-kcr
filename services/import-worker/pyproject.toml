[project]
name = "import-worker"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aio-pika>=9.5,<10",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openpyxl>=3.1,<4",
    "pamqp>=3.3,<4",
    "pandas>=2.2.3,<4",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff"]

[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
