openapi: 3.1.0
info:
  title: Внутреннее API — ai-assistent (TypeScript)
  version: 0.5.0-draft
  summary: ИИ-помощник по данным сервиса; операции только на чтение.
  description: 'Устройство и границы сервиса — ADR-0022 и spec.md §3.4.

    Сервис не имеет собственной БД: каждый запрос читает актуальные данные Clients, Operator Work и Client History.
    Удалённые данные не попадают в контекст.

    Инструменты чтения встроены в сервис как MCP-сервер и наружу не публикуются. Ассистент не меняет этапы, статусы,
    назначения и состав обзвона.

    Ответы основаны только на фактах сервиса; при нехватке данных ассистент прямо сообщает об этом. В текстах
    допустимы только «непереданные документы» и «неотправленные документы».

    В облачный провайдер передаются данные клиента из запроса и результат отбора; полные выгрузки не передаются.

    Провайдер и модель задаются конфигурацией и согласуются отдельно.

    По ADR-0010 доступ пользователей проверяет Gateway: он передаёт личность и роль в заголовках X-User-Id и
    X-User-Role, которым сервис доверяет безусловно. Внутренний контур изолируется на уровне сети.

    Чат закреплён за клиентом из маршрута: код клиента и идентичность пользователя передаются в каждый вызов
    инструментов, модель их не выбирает.

    '
servers:
- url: http://assistant:8000/internal/v1
  description: Внутренняя сеть (адрес зарезервирован за сервисом в server/compose.yaml; итоговый зависит от инфраструктуры развертывания).
tags:
- name: Assistant
  description: Операции ИИ-помощника; только чтение.
paths:
  /assistant/summary/{kcr_code}:
    get:
      tags:
      - Assistant
      operationId: getSummary
      summary: Сводка «Контекст перед звонком»
      description: 'Сводка из 5–7 пунктов по фактам сервиса: непереданные документы и их периоды, изменение к прошлому
        срезу, какой по счёту предстоит звонок, когда звонили в прошлый раз, что и к какому сроку обещал клиент и
        выполнены ли обещания. Модель вызывается через облачный API стороннего провайдера.'
      x-roles:
      - ADMIN
      - OPERATOR
      parameters:
      - $ref: '#/components/parameters/KcrCode'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      responses:
        '200':
          description: Сводка по клиенту.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantSummaryResponse'
        '404':
          description: Клиент не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: Клиент не найден
        '503':
          description: 'ASSISTANT_UNAVAILABLE: облачный провайдер или внутренний сервис недоступен.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ASSISTANT_UNAVAILABLE
                message: Помощник временно недоступен, повторите позже
  /assistant/chat/{kcr_code}:
    post:
      tags:
      - Assistant
      operationId: chat
      summary: Ответ на вопрос по клиенту
      description: 'Ответ на вопрос о текущем состоянии клиента и динамике изменения статуса передачи документов за
        выбранный период. Ответ передаётся потоком по протоколу UI message stream (AI SDK): тело — Server-Sent Events,
        каждая строка `data:` несёт часть ответа в JSON, поток завершается маркером `data: [DONE]`.


        Части потока: `text-start`, `text-delta`, `text-end` — текст ответа; `start-step`, `finish-step`, `finish` —
        границы шагов и сообщения; `tool-input-*` и `tool-output-available` — вызовы инструментов чтения и их
        результаты; `error` — ошибка.


        `data-event-references` — в `data` массив ссылок на записи хроники и наблюдений журнала, на которых основан
        ответ; может быть пустым.


        Запрос на ввод (MCP input required): если период не определён, ассистент возвращает вызов клиентского
        инструмента `request_input` без результата — в `input` один `InputRequest`. Клиент показывает форму по
        `requested_schema` и передаёт `InputResponse` как результат этого вызова в следующем запросе; сервис
        повторяет вызов инструмента с ответом. При `decline` и `cancel` ассистент отвечает без недостающих данных.


        Инструменты чата ограничены клиентом из маршрута.'
      x-roles:
      - ADMIN
      - OPERATOR
      parameters:
      - $ref: '#/components/parameters/KcrCode'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Поток ответа по протоколу UI message stream.
          headers:
            x-vercel-ai-ui-message-stream:
              required: true
              schema:
                type: string
                const: v1
              description: Версия протокола потока.
            cache-control:
              required: true
              schema:
                type: string
                const: no-cache
            x-accel-buffering:
              required: true
              schema:
                type: string
                const: 'no'
              description: Запрет буферизации для nginx.
          content:
            text/event-stream:
              schema:
                type: string
                description: Строки Server-Sent Events с частями ответа.
        '400':
          description: Некорректное тело запроса или сообщения диалога.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Клиент не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'ASSISTANT_UNAVAILABLE: облачный провайдер или внутренний сервис недоступен.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assistant/filter-query:
    post:
      tags:
      - Assistant
      operationId: filterQuery
      summary: Приоритетный список клиентов на обзвон по запросу словами
      description: 'Критерии запроса переводятся в фильтры реестра (`GET /clients`); отбор выполняет Clients Service,
        а не модель. Условия без фильтра в реестре — исключение признака и наличие ответственного — сервис применяет
        по данным Clients и Operator Work. Модель формулирует причину попадания клиента только по фактам отобранной
        записи.


        `criteria` возвращает применённые условия, `not_applied` — условия запроса, которые отбор не учёл. Список
        ничего не публикует: передача операторам остаётся отдельным действием администратора.


        Если критерии не определены, операция отвечает `422 INPUT_REQUIRED` с вопросом и формами; клиент повторяет
        запрос, дополнив его ответом.'
      x-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterQueryRequest'
            example:
              query: Не VIP, непереданных >25%, без изменений, ещё не в работе
              limit: 200
      responses:
        '200':
          description: Отобранные клиенты с причинами соответствия.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterQueryResponse'
        '400':
          description: Запрос не удалось разобрать.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_QUERY
                message: Не удалось разобрать текст запроса
        '422':
          description: 'INPUT_REQUIRED: критерии не определены, нужен ответ пользователя.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INPUT_REQUIRED
                message: Уточните порог процента непереданных документов
                details:
                  requests:
                  - key: min_unsubmitted_percent
                    message: Начиная с какого процента непереданных документов включать клиентов?
                    requested_schema:
                      type: object
                      properties:
                        min_unsubmitted_percent:
                          type: number
                          title: Процент непереданных документов, от
                          minimum: 0
                          maximum: 100
                      required:
                      - min_unsubmitted_percent
        '503':
          description: 'ASSISTANT_UNAVAILABLE: облачный провайдер или внутренний сервис недоступен.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    KcrCode:
      name: kcr_code
      in: path
      required: true
      description: Код КЦР — первичный бизнес-ключ клиента.
      schema:
        type: string
      example: 6671-0042
    UserIdHeader:
      name: X-User-Id
      in: header
      required: true
      description: Идентификатор пользователя, проверенный Gateway (ADR-0010).
      schema:
        type: string
        format: uuid
    UserRoleHeader:
      name: X-User-Role
      in: header
      required: true
      description: Роль пользователя, проверенная Gateway (ADR-0010).
      schema:
        type: string
        enum:
        - ADMIN
        - OPERATOR
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    AssistantSummaryResponse:
      type: object
      required:
      - kcr_code
      - summary
      - generated_at
      properties:
        kcr_code:
          type: string
        summary:
          type: string
          description: Сводка «Контекст перед звонком», 5–7 строк.
          example: 'VIP-клиент, закреплён за petrov.

            Непереданных документов: 12 из 40 (2026_Q1).

            Динамика: GROWING два среза подряд.

            Последний звонок 2026-01-28: AGREEMENT, обещал 2026-02-10.

            Обещанный срок истёк.'
        generated_at:
          type: string
          format: date-time
    UIMessage:
      type: object
      description: Сообщение диалога в формате AI SDK UI message.
      required:
      - id
      - role
      - parts
      properties:
        id:
          type: string
        role:
          type: string
          enum:
          - user
          - assistant
        parts:
          type: array
          items:
            type: object
            additionalProperties: true
            description: 'Часть сообщения: текст, вызов инструмента или результат инструмента. Состав частей
              определяется протоколом AI SDK.'
    ChatRequest:
      type: object
      required:
      - messages
      properties:
        messages:
          type: array
          minItems: 1
          description: История диалога; последнее сообщение задаёт новый вопрос или результат клиентского инструмента.
          items:
            $ref: '#/components/schemas/UIMessage'
    InputRequest:
      type: object
      description: Запрос на ввод — сообщение и схема полей формы.
      required:
      - key
      - message
      - requested_schema
      properties:
        key:
          type: string
          description: Имя запрашиваемого данного; совпадает с именем поля в `requested_schema`.
        message:
          type: string
          description: Вопрос пользователю.
        requested_schema:
          type: object
          additionalProperties: true
          description: Плоская JSON Schema из примитивных полей формы.
    InputResponse:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - accept
          - decline
          - cancel
        content:
          type: object
          additionalProperties: true
          description: Значения полей формы по `requested_schema`; только при `accept`.
    FilterQueryRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
          description: Запрос на естественном языке.
          example: Не VIP, непереданных >25%, без изменений
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          description: Максимальное число клиентов в списке — объём выборки под возможности операторов. По умолчанию
            применяется настройка сервиса.
          example: 200
    SelectionCriteria:
      type: object
      description: Применённые условия отбора. Имена полей совпадают с параметрами фильтра реестра (`GET /clients`);
        `exclude_tags` и `assignment` применяет сервис.
      additionalProperties: false
      properties:
        quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          description: Квартал сравнения с предшествующим.
        work_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          description: Квартал обзвона.
        dynamics:
          type: string
          enum:
          - REDUCING
          - NO_CHANGE
          - GROWING
          - ALL_SUBMITTED
        duration:
          type: string
          enum:
          - FIRST_TIME
          - REPEATED
          - LONG_DELAY_2Q
        tags:
          type: array
          items:
            type: string
          description: Признаки, которые клиент должен иметь.
        exclude_tags:
          type: array
          items:
            type: string
          description: Признаки, которых у клиента не должно быть.
        assignment:
          type: string
          enum:
          - FREE
          - ASSIGNED
          description: Наличие активного ответственного в текущем опубликованном цикле.
        min_unsubmitted_documents:
          type: integer
          minimum: 0
        max_unsubmitted_documents:
          type: integer
          minimum: 0
        min_unsubmitted_percent:
          type: number
          minimum: 0
          maximum: 100
        max_unsubmitted_percent:
          type: number
          minimum: 0
          maximum: 100
    FilterQueryResponse:
      type: object
      required:
      - items
      - total
      - criteria
      - not_applied
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - kcr_code
            - reason
            properties:
              kcr_code:
                type: string
              reason:
                type: string
                description: Причина попадания в список по фактам отобранной записи.
                example: Не VIP, непереданных 32%, динамика NO_CHANGE
        total:
          type: integer
          minimum: 0
          description: Число клиентов, подходящих под применённые условия, до ограничения `limit`.
        criteria:
          $ref: '#/components/schemas/SelectionCriteria'
        not_applied:
          type: array
          items:
            type: string
          description: Условия запроса, которые отбор не учёл; может быть пустым.
          example:
          - обещали передать до конца месяца
