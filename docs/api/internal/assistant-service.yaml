openapi: 3.1.0
info:
  title: Внутреннее API — Assistant Service (Python)
  version: 0.4.0-draft
  summary: Облачный ИИ-провайдер; конкретные функции согласуются позже.
  description: |
    Актуальные правила — spec.md 1.4 и ADR-0002 (уточнения пользователя от 05.11.2026).
    Квартал выбирается пользователем при загрузке; дата файла и имя листа не назначают его автоматически.
    Периоды только квартальные. Непереданные документы учитываются в следующих кварталах под исходным периодом без двойного счёта.
    Два квартала непрерывной задержки и более — LONG_DELAY_2Q.
    WAIT_DEADLINE с ещё не наступившей датой оператора сохраняет ответственного, включая новый квартал.
    По наступлении даты при остатке клиент доступен в POOL. Пустые поля наследуются с needs_review и происхождением.
    Rollback только последнего пакета; ручное удаление очищает также начатую работу операторов.
    ИИ использует облачный API стороннего провайдера; конкретные функции отложены до отдельного обсуждения.

    Внутренние пути остаются проектными контрактами; инфраструктурные детали — до реализации.
servers:
- url: http://assistant-service:8000/internal/v1
  description: Внутренняя сеть (пример адреса; итоговый зависит от инфраструктуры развертывания).
tags:
- name: Assistant
  description: Операции ИИ-ассистента.
paths:
  /assistant/summary/{kcr_code}:
    get:
      tags:
      - Assistant
      operationId: getSummary
      summary: Сводка «Контекст перед звонком» [Функции не согласованы]
      description: Предложение API; конкретная функция и её приёмочные критерии отложены до отдельного обсуждения.
        Модель вызывается через облачный API стороннего провайдера. Удалённые данные исключаются из контекста.
      parameters:
      - $ref: '#/components/parameters/KcrCode'
      responses:
        '200':
          description: Сводка по клиенту.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResponse'
        '404':
          description: Клиент не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-status: proposal-pending-ai-scope
  /assistant/filter-query:
    post:
      tags:
      - Assistant
      operationId: filterQuery
      summary: Отбор словами [Функции не согласованы]
      description: Предложение API; конкретная функция и её приёмочные критерии отложены до отдельного обсуждения.
        Модель вызывается через облачный API стороннего провайдера. Удалённые данные исключаются из контекста.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterQueryRequest'
            example:
              query: Не VIP, непереданных >25%, без изменений
      responses:
        '200':
          description: Совпавшие клиенты с причинами соответствия.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterQueryResponse'
        '400':
          description: Запрос не удалось разобрать.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-status: proposal-pending-ai-scope
  /assistant/chat:
    post:
      tags:
      - Assistant
      operationId: chat
      summary: Вопрос по карточке клиента [Функции не согласованы]
      description: Предложение API; конкретная функция и её приёмочные критерии отложены до отдельного обсуждения.
        Модель вызывается через облачный API стороннего провайдера. Удалённые данные исключаются из контекста.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              kcr_code: 6671-0042
              message: Обещал ли клиент передать оригиналы и когда?
      responses:
        '200':
          description: Ответ ассистента.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '404':
          description: Клиент не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-status: proposal-pending-ai-scope
components:
  parameters:
    KcrCode:
      name: kcr_code
      in: path
      required: true
      description: Код КЦР — первичный бизнес-ключ клиента.
      schema:
        type: string
      example: 6671-0042
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
    SummaryResponse:
      type: object
      required:
      - kcr_code
      - summary
      - generated_at
      properties:
        kcr_code:
          type: string
        summary:
          type: string
          description: Сводка «Контекст перед звонком», 5–7 строк.
          example: |-
            VIP-клиент, закреплён за petrov.
            Непереданных документов: 12 из 40 (2026_Q1).
            Динамика: GROWING два среза подряд.
            Последний звонок 2026-01-28: AGREEMENT, обещал 2026-02-10.
            Обещанный срок истёк.
        generated_at:
          type: string
          format: date-time
    FilterQueryRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
          example: Не VIP, непереданных >25%, без изменений
    FilterQueryResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - kcr_code
            - reason
            properties:
              kcr_code:
                type: string
              reason:
                type: string
                example: Не VIP, непереданных 32%, динамика NO_CHANGE
    ChatRequest:
      type: object
      required:
      - kcr_code
      - message
      properties:
        kcr_code:
          type: string
        message:
          type: string
          minLength: 1
    EventReference:
      type: object
      description: Ссылка на событие, на котором основан ответ.
      required:
      - event_id
      - event_date
      properties:
        event_id:
          type: string
          format: uuid
        event_date:
          type: string
          format: date-time
          description: Значение `historical_event_date`, если заполнена, иначе `created_at`.
    ChatResponse:
      type: object
      required:
      - answer
      - event_references
      properties:
        answer:
          type: string
          description: Ответ строго на основе контекста БД по клиенту.
        event_references:
          type: array
          items:
            $ref: '#/components/schemas/EventReference'
          description: Ссылки на даты событий; может быть пустым.
