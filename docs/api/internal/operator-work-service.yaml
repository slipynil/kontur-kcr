openapi: 3.1.0
info:
  title: Внутреннее API — Operator Work Service (Python)
  version: 0.4.0-draft
  summary: 'Процесс обзвона: взятие и перезакрепление клиентов, лента событий.'
  description: 'Актуальные правила — spec.md 1.5 и ADR-0002 (уточнения пользователя от 05.11.2026).

    Квартал выбирается пользователем при загрузке; дата файла и имя листа не назначают его автоматически.

    Периоды только квартальные. Непереданные документы учитываются в следующих кварталах под исходным периодом без
    двойного счёта.

    Два квартала непрерывной задержки и более — LONG_DELAY_2Q.

    WAIT_DEADLINE с ещё не наступившей датой оператора сохраняет ответственного, включая новый квартал.

    По наступлении даты при остатке клиент доступен в POOL. Пустые поля наследуются с needs_review и происхождением.

    Rollback только последнего пакета; удаление клиента очищает его работу; удаление квартала сохраняет остальные
    кварталы и общую историю.

    ИИ использует облачный API стороннего провайдера; конкретные функции отложены до отдельного обсуждения.


    Внутренние пути остаются проектными контрактами; инфраструктурные детали — до реализации.


    Уточнения 07.11.2026: ADR-0003; удаление квартала сохраняет остальные кварталы и общую историю работы.

    '
servers:
- url: http://operator-work-service:8000/internal/v1
  description: Внутренняя сеть (пример адреса; итоговый зависит от инфраструктуры развертывания).
tags:
- name: Assignment
  description: Закрепление клиентов за операторами.
- name: Events
  description: Лента событий клиента.
paths:
  /clients/{kcr_code}/take:
    post:
      tags:
      - Assignment
      operationId: takeClient
      summary: Взять или перезакрепить клиента на себя
      description: 'Взять/перезакрепить клиента себе в выбранном work_quarter. Другой ответственный сам по себе
        не препятствует операции.

        Если существует действующее ожидание (business_date < wait_until), сохраняются WAIT_DEADLINE и тот же оператор,
        даже при смене квартала.

        Другой оператор получает 409 CLIENT_WAIT_DEADLINE_ACTIVE. Запрос того же ответственного идемпотентен.

        По наступлении даты при остатке документов ожидание нормализуется в POOL без активного назначения; клиент
        доступен для взятия.

        Срок не продлевается автоматически. Проверка даты, нормализация и назначение атомарны; business_date — Europe/Moscow.

        Исторический квартал нельзя сделать текущим запросом take; 409 INVALID_STATE. Удалённые данные недоступны.

        '
      parameters:
      - $ref: '#/components/parameters/WorkQuarter'
      - $ref: '#/components/parameters/KcrCode'
      - $ref: '#/components/parameters/UserIdHeader'
      responses:
        '200':
          description: Клиент закреплён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeResponse'
        '404':
          description: Клиент не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ещё действует WAIT_DEADLINE, либо указан исторический/недопустимый цикл.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: CLIENT_WAIT_DEADLINE_ACTIVE
                message: Срок ожидания, установленный оператором, ещё не наступил
                details:
                  work_quarter: 2026_Q2
                  wait_source_work_quarter: 2026_Q1
                  stage: WAIT_DEADLINE
                  wait_until: '2026-07-15'
                  operator_name: petrov
  /clients/{kcr_code}/events:
    get:
      tags:
      - Events
      operationId: listClientEvents
      summary: Лента событий клиента [Предложение]
      description: 'История событий клиента: используется карточкой клиента (`spec.md` §4.3),

        Assistant Service (контекст для сводки и чата) и MCP-инструментом

        `get_client_events`.


        История обычно сохраняется, но удаляется вместе с явно удалёнными данными клиента/квартала и при последнем
        rollback.'
      parameters:
      - name: work_quarter
        in: query
        required: false
        description: Квартал обзвона. Для списка/карточки без фильтра используется последний цикл; лента без фильтра
          объединяет все циклы.
        schema:
          type: string
          pattern: ^\d{4}_Q[1-4]$
      - $ref: '#/components/parameters/KcrCode'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Страница ленты событий, свежие первыми.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '404':
          description: Клиент не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Events
      operationId: createClientEvent
      summary: Добавить событие клиента
      description: 'Для нового звонка/смены этапа/закрепления обязателен work_quarter текущего цикла.

        NULL разрешён для старого комментария без установленного цикла.

        Фиксация звонка, комментария прошлой даты (ручная `historical_event_date`)

        и других событий (`spec.md` §3.3, §2.4).


        История обычно сохраняется, но удаляется вместе с явно удалёнными данными клиента/квартала и при последнем
        rollback.'
      parameters:
      - $ref: '#/components/parameters/KcrCode'
      - $ref: '#/components/parameters/UserIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientEventCreate'
      responses:
        '201':
          description: Событие создано.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientEvent'
        '400':
          description: Некорректное событие.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Клиент не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /data-cleanup:
    post:
      operationId: cleanupOperatorData
      summary: Очистить связанную работу после удаления данных
      description: "Разрешённая административная очистка выбранных данных. Удаление клиента очищает все его срезы,\
        \ циклы, события, назначения и сроки.\nУдаление исходного квартала сохраняет остальные кварталы и общую\
        \ историю взаимодействия. Циклы других кварталов и общие звонки/договорённости не удаляются каскадно.\n\
        Начатая работа оператора не блокирует удаление. Ответ участника подтверждает только локальную очистку; координатор возвращает глобальный успех после всех сервисов\
        \ и кэшей.\n Вызывает доверенный сервис от имени ADMIN; операция идемпотентна по operation_id."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - operation_id
              - kcr_code
              - scope
              properties:
                operation_id:
                  type: string
                  format: uuid
                kcr_code:
                  type: string
                scope:
                  type: string
                  enum:
                  - CLIENT
                  - QUARTER
                  - BATCH
                quarter:
                  type: string
                  pattern: ^\d{4}_Q[1-4]$
                  example: 2026_Q2
                batch_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Связанная работа, сроки и переносы удалены.
        '409':
          description: Конфликт состояния, операция подлежит повтору.
components:
  parameters:
    WorkQuarter:
      name: work_quarter
      in: query
      required: true
      description: Квартал данных, выбранный при загрузке. Действующее ожидание предыдущего цикла сохраняет ответственного
        до wait_until.
      schema:
        type: string
        pattern: ^\d{4}_Q[1-4]$
      example: 2026_Q4
    KcrCode:
      name: kcr_code
      in: path
      required: true
      description: Код КЦР — первичный бизнес-ключ клиента.
      schema:
        type: string
      example: 6671-0042
    UserIdHeader:
      name: X-User-Id
      in: header
      required: true
      description: 'Пользователь, от имени которого выполняется действие: проставляется

        Gateway или MCP-сервером ассистента.

        '
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    EventType:
      type: string
      enum:
      - CALL_RESULT
      - HISTORICAL_COMMENT
      - EMAIL_SENT
      - STAGE_CHANGE
      - CLAIM_UPDATE
      - OPERATOR_ASSIGN
    CallResult:
      type: string
      enum:
      - AGREEMENT
      - REFUSAL
      - NO_ANSWER
      - WRONG_NUMBER
    ClientEventCreate:
      type: object
      required:
      - event_type
      - comment_text
      allOf:
      - if:
          properties:
            event_type:
              enum:
              - CALL_RESULT
              - EMAIL_SENT
              - STAGE_CHANGE
              - CLAIM_UPDATE
              - OPERATOR_ASSIGN
          required:
          - event_type
        then:
          required:
          - work_quarter
          properties:
            work_quarter:
              type: string
      - if:
          properties:
            stage:
              const: WAIT_DEADLINE
          required:
          - stage
        then:
          required:
          - wait_until
          properties:
            wait_until:
              type: string
              format: date
      - if:
          properties:
            event_type:
              const: STAGE_CHANGE
          required:
          - event_type
        then:
          required:
          - stage
      properties:
        work_quarter:
          type:
          - string
          - 'null'
          pattern: ^\d{4}_Q[1-4]$
          description: Квартал цикла обзвона; может отличаться от кварталов документов.
        event_type:
          $ref: '#/components/schemas/EventType'
        call_result:
          $ref: '#/components/schemas/CallResult'
          description: Обязателен при `event_type = CALL_RESULT`.
        promised_date:
          type:
          - string
          - 'null'
          format: date
        comment_text:
          type: string
        historical_event_date:
          type:
          - string
          - 'null'
          format: date-time
          description: Заполняется оператором для «прошлого комментария».
        wait_until:
          type:
          - string
          - 'null'
          format: date
          description: Дата, устанавливаемая оператором при переходе в WAIT_DEADLINE
        stage:
          type: string
          enum:
          - POOL
          - IN_WORK
          - WAIT_DEADLINE
          - CLAIM
          - CLOSED
          description: Новый этап для STAGE_CHANGE; WAIT_DEADLINE требует wait_until.
    ClientEvent:
      type: object
      description: Событие ленты (`spec.md` §2.4).
      required:
      - id
      - kcr_code
      - author_id
      - event_type
      - comment_text
      - created_at
      properties:
        work_quarter:
          type:
          - string
          - 'null'
          pattern: ^\d{4}_Q[1-4]$
          description: Квартал цикла обзвона; может отличаться от кварталов документов.
        id:
          type: string
          format: uuid
        kcr_code:
          type: string
        author_id:
          type: string
          format: uuid
        event_type:
          $ref: '#/components/schemas/EventType'
        call_result:
          $ref: '#/components/schemas/CallResult'
        promised_date:
          type:
          - string
          - 'null'
          format: date
        comment_text:
          type: string
        historical_event_date:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        stage:
          type:
          - string
          - 'null'
        wait_until:
          type:
          - string
          - 'null'
          format: date
    EventListResponse:
      type: object
      required:
      - items
      - page
      - page_size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientEvent'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    TakeResponse:
      type: object
      required:
      - work_quarter
      - kcr_code
      - assigned_operator_id
      - assigned_at
      properties:
        work_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          description: Квартал цикла обзвона; может отличаться от кварталов документов.
        kcr_code:
          type: string
        assigned_operator_id:
          type: string
          format: uuid
        assigned_at:
          type: string
          format: date-time
