openapi: 3.1.0
info:
  title: Внутреннее API — Clients Service (Python)
  version: 0.4.0-draft
  summary: Реестр клиентов и история срезов для остальных микросервисов.
  description: |
    Актуальные правила — spec.md 1.4 и ADR-0002 (уточнения пользователя от 05.11.2026).
    Квартал выбирается пользователем при загрузке; дата файла и имя листа не назначают его автоматически.
    Периоды только квартальные. Непереданные документы учитываются в следующих кварталах под исходным периодом без двойного счёта.
    Два квартала непрерывной задержки и более — LONG_DELAY_2Q.
    WAIT_DEADLINE с ещё не наступившей датой оператора сохраняет ответственного, включая новый квартал.
    По наступлении даты при остатке клиент доступен в POOL. Пустые поля наследуются с needs_review и происхождением.
    Rollback только последнего пакета; ручное удаление очищает также начатую работу операторов.
    ИИ использует облачный API стороннего провайдера; конкретные функции отложены до отдельного обсуждения.

    Внутренние пути остаются проектными контрактами; инфраструктурные детали — до реализации.
servers:
- url: http://clients-service:8000/internal/v1
  description: Внутренняя сеть (пример адреса; итоговый зависит от инфраструктуры развертывания).
tags:
- name: Registry
  description: Чтение реестра клиентов.
- name: Import
  description: Применение и откат данных импорта. Вызывает только Import Worker.
paths:
  /clients:
    get:
      tags:
      - Registry
      operationId: listClients
      summary: Поиск по реестру
      description: |
        Те же фильтры, что у публичного `GET /api/v1/clients` (`spec.md` §3.3).
        Используется Gateway (прокси), Operator Work Service и Assistant Service
        (отбор клиентов под обзвон).
      parameters:
      - name: search
        in: query
        description: Поиск по Коду КЦР или ИНН.
        schema:
          type: string
      - name: dynamics
        in: query
        schema:
          $ref: '#/components/schemas/Dynamics'
      - name: duration
        in: query
        schema:
          $ref: '#/components/schemas/Duration'
      - name: tags
        in: query
        description: Признаки клиента через запятую.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        style: form
        explode: false
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Страница реестра.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientListResponse'
  /clients/{kcr_code}:
    get:
      tags:
      - Registry
      operationId: getClient
      summary: Карточка клиента с историей срезов
      description: |
        Клиент и его срезы по кварталам (свежие первыми). Operator Work Service
        использует карточку для пула обзвона; Assistant Service — для сводки «Контекст
        перед звонком» (последние 3 среза, `spec.md` §3.4).
      parameters:
      - $ref: '#/components/parameters/KcrCode'
      - name: snapshots_limit
        in: query
        description: Сколько последних срезов вернуть.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 8
      responses:
        '200':
          description: Карточка клиента.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCard'
        '404':
          description: Клиент не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteClient
      summary: Удалить клиента целиком
      description: |
        Разрешённая административная очистка выбранных данных. Удаление клиента очищает все его срезы, циклы, события, назначения и сроки.
        Удаление квартальных данных очищает связанные записи и перенесённую работу этого объекта; другие клиенты не затрагиваются.
        Начатая работа оператора не блокирует удаление. Ответ об успехе — только после очистки всех затронутых сервисов и кэшей.
      parameters:
      - name: kcr_code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Данные и связанная работа удалены; успех только после межсервисной очистки.
        '404':
          description: Объект не найден.
  /clients/{kcr_code}/snapshots/history:
    get:
      tags:
      - Registry
      operationId: getSnapshotHistory
      summary: Журнал изменения статуса передачи документов
      description: |
        Append-only журнал `quarter_snapshot_history` (`spec.md` §2.4): одна
        запись на каждое новое наблюдение числа непереданных документов. Используется
        Assistant Service («последние 3 записи» сводки, `spec.md` §3.4) и
        Gateway (публичный журнал карточки клиента).
      parameters:
      - $ref: '#/components/parameters/KcrCode'
      - name: limit
        in: query
        description: Сколько последних записей вернуть.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Записи журнала, свежие первыми.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SnapshotHistoryRecord'
        '404':
          description: Клиент не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /import/apply:
    post:
      tags:
      - Import
      operationId: applyImport
      summary: Применить пакет импорта [Предложение]
      description: Применить выбранный квартал пакета. Для REGISTRY достаточно профиля, для SNAPSHOT обязателен
        snapshot. Пустые поля наследуются с needs_review и происхождением. Каждый новый срез сохраняется, повтор
        идентичного — нет. Старые даты не заменяют более свежий текущий остаток. Clients не пишет напрямую
        в Operator Work DB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportApplyRequest'
      responses:
        '200':
          description: Пакет применён; статистика изменений.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportApplyResponse'
        '400':
          description: Некорректные данные пакета.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /import/{batch_id}/rollback:
    post:
      tags:
      - Import
      operationId: rollbackImport
      summary: Откатить пакет [Предложение]
      description: Отменить только последний применённый неотменённый пакет в системе. Созданные данные и связанная
        работа операторов удаляются; прежние значения обновлённых записей восстанавливаются. Другой пакет ->
        409 IMPORT_NOT_LATEST. Начатая работа не блокирует откат. Завершение только после согласованной очистки
        сервисов.
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Пакет откачен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRollbackResponse'
        '404':
          description: Пакет не найден или срезов у него нет.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Пакет не последний или имеет недопустимый статус.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: IMPORT_NOT_LATEST
                message: Можно отменить только последний применённый пакет
  /clients/{kcr_code}/snapshots/{quarter}:
    delete:
      operationId: deleteClientQuarter
      summary: Удалить выбранные квартальные данные
      description: |
        Разрешённая административная очистка выбранных данных. Удаление клиента очищает все его срезы, циклы, события, назначения и сроки.
        Удаление квартальных данных очищает связанные записи и перенесённую работу этого объекта; другие клиенты не затрагиваются.
        Начатая работа оператора не блокирует удаление. Ответ об успехе — только после очистки всех затронутых сервисов и кэшей.
      parameters:
      - name: kcr_code
        in: path
        required: true
        schema:
          type: string
      - name: quarter
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q2
      responses:
        '200':
          description: Данные и связанная работа удалены; успех только после межсервисной очистки.
        '404':
          description: Объект не найден.
components:
  parameters:
    KcrCode:
      name: kcr_code
      in: path
      required: true
      description: Код КЦР — первичный бизнес-ключ клиента.
      schema:
        type: string
      example: 6671-0042
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
    Tag:
      type: string
      enum:
      - VIP
      - NOVICE
      - INTEGRATOR
      - TECH_PARTNER
      - MPP
      - DO_NOT_WORK
    ClientStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    Dynamics:
      type: string
      enum:
      - REDUCING
      - NO_CHANGE
      - GROWING
      - ALL_SUBMITTED
    Duration:
      type: string
      enum:
      - FIRST_TIME
      - REPEATED
      - LONG_DELAY_2Q
      description: 'LONG_DELAY_2Q: два квартала непрерывной задержки и более; частичная передача не обнуляет
        длительность. FIRST_TIME/REPEATED требуют отдельного уточнения.'
    QuarterSnapshot:
      type: object
      description: |
        Актуальный срез квартала (`spec.md` §2.3); PK в БД — (`kcr_code`, `quarter`).
      required:
      - kcr_code
      - quarter
      - total_documents
      - unsubmitted_documents
      - import_batch_id
      - snapshot_date
      properties:
        kcr_code:
          type: string
        quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q1
        total_documents:
          type: integer
          minimum: 0
          description: Фиксируется при первой загрузке квартала.
        unsubmitted_documents:
          type: integer
          minimum: 0
        import_batch_id:
          type: string
          format: uuid
        snapshot_date:
          type: string
          format: date
        last_observation_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q2
    Client:
      type: object
      description: |
        Клиент реестра (`spec.md` §2.2). Закрепление и этап не входят — ими
        владеет Operator Work Service (`spec.md` §2.7, §2.8); агрегирует Gateway.
      required:
      - kcr_code
      - inn
      - organization_name
      - status
      - tags
      properties:
        kcr_code:
          type: string
        inn:
          type: string
        kpp:
          type: string
        organization_name:
          type: string
        status:
          $ref: '#/components/schemas/ClientStatus'
        is_blocked:
          type: boolean
        manager_name:
          type: string
        contacts:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        needs_review:
          type: boolean
          description: Проверить унаследованные/неполные сведения
        inherited_fields:
          type: object
          additionalProperties: true
          description: Поле → источник (квартал, пакет, дата)
    ClientCard:
      type: object
      allOf:
      - $ref: '#/components/schemas/Client'
      properties:
        snapshots:
          type: array
          description: Актуальные срезы по кварталам, свежие первыми.
          items:
            $ref: '#/components/schemas/QuarterSnapshot'
        dynamics:
          description: |
            Динамика: две последние записи журнала истории последнего квартала;
            `null`, если запись в квартале одна (первая загрузка).
          oneOf:
          - $ref: '#/components/schemas/Dynamics'
          - type: 'null'
        needs_review:
          type: boolean
          description: Проверить унаследованные/неполные сведения
        inherited_fields:
          type: object
          additionalProperties: true
          description: Поле → источник (квартал, пакет, дата)
        wait_until:
          type:
          - string
          - 'null'
          format: date
          description: Срок оператора; защита действует до этой даты, включая смену квартала
        wait_source_work_quarter:
          type:
          - string
          - 'null'
          description: Исходный цикл защищённого ожидания
        outstanding_documents:
          type: integer
          minimum: 0
          description: Сумма по уникальным исходным периодам без повторного счёта переноса
    SnapshotHistoryRecord:
      type: object
      description: Запись журнала изменения статуса передачи документов (`spec.md` §2.4).
      required:
      - id
      - kcr_code
      - quarter
      - unsubmitted_documents
      - import_batch_id
      - snapshot_date
      - created_at
      properties:
        id:
          type: string
          format: uuid
        kcr_code:
          type: string
        quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
        unsubmitted_documents:
          type: integer
          minimum: 0
          description: Значение после изменения.
        import_batch_id:
          type: string
          format: uuid
        snapshot_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        observation_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q2
    ClientListItem:
      type: object
      description: |
        Строка реестра. Закрепление и этап (`spec.md` §2.7, §2.8) добавляет
        Gateway из Operator Work Service — этим сервисом не отдаются.
      required:
      - kcr_code
      - inn
      - organization_name
      - status
      - tags
      properties:
        kcr_code:
          type: string
        inn:
          type: string
        organization_name:
          type: string
        status:
          $ref: '#/components/schemas/ClientStatus'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        dynamics:
          oneOf:
          - $ref: '#/components/schemas/Dynamics'
          - type: 'null'
        latest_snapshot:
          oneOf:
          - type: object
            required:
            - quarter
            - total_documents
            - unsubmitted_documents
            - snapshot_date
            properties:
              quarter:
                type: string
              total_documents:
                type: integer
              unsubmitted_documents:
                type: integer
              snapshot_date:
                type: string
                format: date
          - type: 'null'
        needs_review:
          type: boolean
          description: Проверить унаследованные/неполные сведения
        inherited_fields:
          type: object
          additionalProperties: true
          description: Поле → источник (квартал, пакет, дата)
        wait_until:
          type:
          - string
          - 'null'
          format: date
          description: Срок оператора; защита действует до этой даты, включая смену квартала
        wait_source_work_quarter:
          type:
          - string
          - 'null'
          description: Исходный цикл защищённого ожидания
        outstanding_documents:
          type: integer
          minimum: 0
          description: Сумма по уникальным исходным периодам без повторного счёта переноса
    ClientListResponse:
      type: object
      required:
      - items
      - page
      - page_size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientListItem'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    ImportApplyRequest:
      type: object
      description: Выбранный пользователем квартал обязателен. Snapshot обязателен для SNAPSHOT; для REGISTRY
        допускается только профиль. Историческая дата не переписывает более свежий остаток.
      required:
      - batch_id
      - uploaded_by
      - items
      - selected_quarter
      - import_type
      - snapshot_date
      properties:
        batch_id:
          type: string
          format: uuid
          description: Идентификатор пакета (`ImportBatch.id`, `spec.md` §2.5).
        uploaded_by:
          type: string
          format: uuid
          description: Пользователь, загрузивший файл.
        items:
          type: array
          minItems: 1
          description: Одна строка листа = один клиент + один срез.
          items:
            type: object
            required:
            - client
            properties:
              client:
                type: object
                required:
                - kcr_code
                properties:
                  kcr_code:
                    type: string
                  inn:
                    type: string
                  kpp:
                    type: string
                  organization_name:
                    type: string
                  status:
                    $ref: '#/components/schemas/ClientStatus'
                  tags:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
                  manager_name:
                    type:
                    - string
                    - 'null'
                  is_blocked:
                    type:
                    - boolean
                    - 'null'
                  contacts:
                    type:
                    - object
                    - 'null'
                  raw_work_status:
                    type:
                    - string
                    - 'null'
              snapshot:
                type: object
                required:
                - quarter
                properties:
                  quarter:
                    type: string
                    pattern: ^\d{4}_Q[1-4]$
                    example: 2026_Q1
                    description: Исходный период документов; по умолчанию выбранный квартал. Старый период
                      сохраняется при переносе.
                  total_documents:
                    type:
                    - integer
                    - 'null'
                    minimum: 0
                    description: |
                      Число документов строки файла. Применяется только при первом
                      срезе квартала; `null`/отсутствие — сохранить прежнее значение.
                  unsubmitted_documents:
                    type:
                    - integer
                    - 'null'
                    minimum: 0
                    description: Пустота наследуется из последних данных с меткой; без предыдущего обязательного
                      значения — ошибка строки.
                  snapshot_date:
                    type: string
                    format: date
                    description: Дата среза (по умолчанию — дата загрузки).
            description: Для REGISTRY достаточно client. Для SNAPSHOT snapshot обязателен. Пустые поля наследуются
              с происхождением.
            allOf:
            - if:
                required:
                - snapshot
              then:
                properties:
                  snapshot:
                    required:
                    - quarter
        selected_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q2
        import_type:
          type: string
          enum:
          - REGISTRY
          - SNAPSHOT
        snapshot_date:
          type: string
          format: date
      allOf:
      - if:
          properties:
            import_type:
              const: SNAPSHOT
          required:
          - import_type
        then:
          properties:
            items:
              items:
                required:
                - snapshot
    ImportApplyResponse:
      type: object
      required:
      - created_clients
      - updated_clients
      - created_snapshots
      - updated_snapshots
      - created_history_records
      - batch_id
      - accepted_rows
      - rejected_rows
      - errors
      properties:
        created_clients:
          type: integer
        updated_clients:
          type: integer
        created_snapshots:
          type: integer
        updated_snapshots:
          type: integer
        created_history_records:
          type: integer
          description: Количество добавленных записей журнала истории.
        batch_id:
          type: string
          format: uuid
        accepted_rows:
          type: integer
        rejected_rows:
          type: integer
        errors:
          type: array
          items:
            type: object
            required: [row_number, code, field]
            properties:
              row_number:
                type: integer
                minimum: 1
                description: Индекс строки в массиве items, с единицы.
              code:
                type: string
              field:
                type: string
    ImportRollbackResponse:
      type: object
      required:
      - batch_id
      - removed_snapshots
      - restored_snapshots
      - removed_history_records
      properties:
        batch_id:
          type: string
          format: uuid
        removed_snapshots:
          type: integer
          description: Срезов, созданных пакетом, удалено.
        restored_snapshots:
          type: integer
          description: Срезов, обновлённых пакетом, восстановлено к прежним значениям.
        removed_history_records:
          type: integer
          description: Записей журнала истории пакета удалено.
