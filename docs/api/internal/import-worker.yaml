openapi: 3.1.0
info:
  title: Внутреннее API — Import Worker (Python)
  version: 0.4.0-draft
  summary: Приём Excel-файлов, асинхронная обработка и откат пакетов импорта.
  description: 'Актуальные правила — spec.md 1.5 и ADR-0002 (уточнения пользователя от 05.11.2026).

    Квартал выбирается пользователем при загрузке; дата файла и имя листа не назначают его автоматически.

    Периоды только квартальные. Непереданные документы учитываются в следующих кварталах под исходным периодом без
    двойного счёта.

    Два квартала непрерывной задержки и более — LONG_DELAY_2Q.

    WAIT_DEADLINE с ещё не наступившей датой оператора сохраняет ответственного, включая новый квартал.

    По наступлении даты при остатке клиент доступен в POOL. Пустые поля наследуются с needs_review и происхождением.

    Rollback только последнего пакета; удаление клиента очищает его работу; удаление квартала сохраняет остальные
    кварталы и общую историю.

    ИИ использует облачный API стороннего провайдера; конкретные функции отложены до отдельного обсуждения.


    Внутренние пути остаются проектными контрактами; инфраструктурные детали — до реализации.


    Уточнения 07.11.2026: ADR-0003; удаление квартала сохраняет остальные кварталы и общую историю работы.

    '
servers:
- url: http://import-api:8000/internal/v1
  description: Импорт-API, внутренняя сеть (пример адреса; итоговый зависит от инфраструктуры развертывания).
tags:
- name: Imports
  description: Пакеты импорта.
paths:
  /imports:
    post:
      tags:
      - Imports
      operationId: uploadImport
      summary: Загрузить файл с выбранным кварталом
      description: Приём XLSX с обязательным выбором квартала и типа данных. Квартал не выводится из даты файла.
        Создаётся пакет; после применения согласованно обновляется работа операторов с сохранением действующего
        срока.
      parameters:
      - $ref: '#/components/parameters/UserIdHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - selected_quarter
              - import_type
              - snapshot_date
              properties:
                file:
                  type: string
                  format: binary
                  description: Excel-файл `.xlsx`.
                selected_quarter:
                  type: string
                  pattern: ^\d{4}_Q[1-4]$
                  example: 2026_Q2
                import_type:
                  type: string
                  enum:
                  - REGISTRY
                  - SNAPSHOT
                snapshot_date:
                  type: string
                  format: date
      responses:
        '202':
          description: Файл принят в обработку.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '400':
          description: Файл не передан или не является `.xlsx`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports/{batch_id}:
    get:
      tags:
      - Imports
      operationId: getImport
      summary: Отчёт о пакете [Предложение]
      description: |
        Сводка импорта для дашборда (`spec.md` §4.1): счётчики успешно/ошибок и
        строки `import_errors` с причинами отсева. Файл с теми же ошибками доступен по `/imports/{batch_id}/errors.xlsx`.
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Пакет найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '404':
          description: Пакет не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports/{batch_id}/errors.xlsx:
    get:
      tags:
      - Imports
      operationId: downloadImportErrors
      summary: Скачать ошибки пакета в Excel
      description: Книга содержит лист, номер строки Excel, код КЦР и причину. Для пакета без ошибок возвращается книга с заголовками.
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Отчёт об ошибках.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '404':
          description: Пакет не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports/{batch_id}/rollback:
    post:
      tags:
      - Imports
      operationId: rollbackImport
      summary: Откатить импорт
      description: Отменить только последний применённый неотменённый пакет в системе. Созданные данные и связанная
        работа операторов удаляются; прежние значения обновлённых записей восстанавливаются. Другой пакет -> 409
        IMPORT_NOT_LATEST. Начатая работа не блокирует откат. Завершение только после согласованной очистки сервисов.
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Пакет откачен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '404':
          description: Пакет не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Пакет не последний или имеет недопустимый статус.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: IMPORT_NOT_LATEST
                message: Можно отменить только последний применённый пакет
        '503':
          description: Координация отката между затронутыми сервисами недоступна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: IMPORT_ROLLBACK_UNAVAILABLE
                message: Координация отката между сервисами недоступна
components:
  parameters:
    UserIdHeader:
      name: X-User-Id
      in: header
      required: true
      description: Пользователь, загрузивший файл; проставляется Gateway.
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
    ImportErrorRow:
      type: object
      required:
      - row_number
      - reason
      properties:
        row_number:
          type: integer
          description: Номер строки Excel с единицы. Ноль обозначает сообщение о листе или книге целиком.
        kcr_code:
          type:
          - string
          - 'null'
        reason:
          type: string
          example: В строке отсутствует Код КЦР
        sheet:
          type: string
    ImportBatch:
      type: object
      description: Пакет с выбранным кварталом и результатами. Отчёт содержит ошибки; rollback разрешён только для
        последнего применённого пакета.
      required:
      - id
      - uploaded_by
      - filename
      - status
      - total_rows
      - success_count
      - error_count
      - created_at
      - selected_quarter
      - import_type
      - snapshot_date
      properties:
        id:
          type: string
          format: uuid
        uploaded_by:
          type: string
          format: uuid
        filename:
          type: string
        status:
          type: string
          enum:
          - PROCESSING
          - COMPLETED
          - ROLLED_BACK
          - FAILED
        total_rows:
          type: integer
        success_count:
          type: integer
        error_count:
          type: integer
        error_log:
          type: array
          items:
            $ref: '#/components/schemas/ImportErrorRow'
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        clients_applied_at:
          type: [string, 'null']
          format: date-time
          description: Clients Service подтвердил локальное применение. Обновление операторской работы ещё не подтверждено.
        selected_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q2
        import_type:
          type: string
          enum:
          - REGISTRY
          - SNAPSHOT
        snapshot_date:
          type: string
          format: date
