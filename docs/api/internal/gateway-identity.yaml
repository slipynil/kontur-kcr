openapi: 3.1.0
info:
  title: Внутреннее API — Gateway / Identity Service (Go)
  version: 0.4.0-draft
  summary: Данные о пользователях для остальных микросервисов и контракт заголовков при проксировании.
  description: |
    Актуальные правила — spec.md 1.4 и ADR-0002 (уточнения пользователя от 05.11.2026).
    Квартал выбирается пользователем при загрузке; дата файла и имя листа не назначают его автоматически.
    Периоды только квартальные. Непереданные документы учитываются в следующих кварталах под исходным периодом без двойного счёта.
    Два квартала непрерывной задержки и более — LONG_DELAY_2Q.
    WAIT_DEADLINE с ещё не наступившей датой оператора сохраняет ответственного, включая новый квартал.
    По наступлении даты при остатке клиент доступен в POOL. Пустые поля наследуются с needs_review и происхождением.
    Rollback только последнего пакета; ручное удаление очищает также начатую работу операторов.
    ИИ использует облачный API стороннего провайдера; конкретные функции отложены до отдельного обсуждения.

    Внутренние пути остаются проектными контрактами; инфраструктурные детали — до реализации.
servers:
- url: http://gateway-identity:8080/internal/v1
  description: Внутренняя сеть (пример адреса; итоговый зависит от инфраструктуры развертывания).
tags:
- name: Users
  description: Данные пользователей для внутренних сервисов.
paths:
  /users/{user_id}:
    get:
      tags:
      - Users
      operationId: getUser
      summary: Карточка пользователя [Предложение]
      description: |
        Данные пользователя по `id`. Используется для отображения ответственного
        и авторов событий в карточке клиента.
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Пользователь найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalUser'
        '404':
          description: Пользователь не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users:
    get:
      tags:
      - Users
      operationId: listUsersByIds
      summary: Пакетный поиск пользователей [Предложение]
      description: |
        Поиск нескольких пользователей по `id` — для отображения авторов в ленте
        событий (Operator Work Service, Assistant Service).
      parameters:
      - name: ids
        in: query
        required: true
        description: Идентификаторы пользователей через запятую.
        schema:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
        style: form
        explode: false
      responses:
        '200':
          description: Найденные пользователи (отсутствующие `id` пропускаются).
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InternalUser'
        '400':
          description: Некорректный список `ids`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
    Role:
      type: string
      enum:
      - ADMIN
      - OPERATOR
    InternalUser:
      type: object
      description: |
        Данные пользователя для внутренних сервисов. `display_name` — открытое
        имя; пока в модели `User` такого поля нет (`spec.md` §2.1), используется
        `login` (открытый вопрос 2).
      required:
      - id
      - login
      - display_name
      - role
      - is_active
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        display_name:
          type: string
          description: Имя для отображения (сейчас — `login`).
        role:
          $ref: '#/components/schemas/Role'
        is_active:
          type: boolean
