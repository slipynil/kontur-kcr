              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - ADMIN
  /api/v1/imports/{batch_id}:
    get:
      tags:
      - Imports
      operationId: getImport
      summary: Отчёт о пакете [Предложение]
      description: 'Сводка импорта для дашборда (`spec.md` §4.1): счётчики успешно/ошибок и

        строки `import_errors` с причинами отсева (для виджета скачивания

        `.xlsx` с ошибками).

        '
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Пакет найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '404':
          description: Пакет не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - ADMIN
  /api/v1/clients/{kcr_code}/snapshots/{quarter}:
    delete:
      operationId: deleteClientQuarter
      summary: Удалить выбранные квартальные данные
      description: 'ADR-0006: Удаление клиента очищает его рабочие данные. Удаление исходного квартала сохраняет
        остальные кварталы, профиль, теги и общую операторскую историю. Отсутствующий объект успешен с нулевыми
        счётчиками. Gateway/Import добавляет requested_by из проверенного пользовательского контекста. Публичный
        успех допустим только после всех участников. Повтор operation_id безопасен; тот же ID с другим payload даёт
        409. Восстановительные копии не выдаются Registry API; необратимое уничтожение undo не согласовано.'
      parameters:
      - name: kcr_code
        in: path
        required: true
        schema:
          type: string
      - name: quarter
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q2
      responses:
        '200':
          description: Данные и связанная работа удалены; успех только после межсервисной очистки.
        '400':
          description: Некорректная команда.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: OPERATION_PAYLOAD_CONFLICT, IMPORT_NOT_LATEST, IMPORT_ORDER_UNKNOWN или конфликт состояния.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Локальная транзакция отменена; повторить тот же operation_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCommand'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WorkQuarter:
      name: work_quarter
      in: query
      required: true
      description: Квартал данных, выбранный при загрузке. Действующее ожидание предыдущего цикла сохраняет ответственного
        до wait_until.
      schema:
        type: string
        pattern: ^\d{4}_Q[1-4]$
      example: 2026_Q4
    KcrCode:
      name: kcr_code
      in: path
      required: true
      description: Код КЦР — первичный бизнес-ключ клиента (`spec.md` §1.2).
      schema:
        type: string
      example: 6671-0042
    BatchId:
      name: batch_id
      in: path
      required: true
      description: Идентификатор пакета импорта (`ImportBatch.id`).
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Номер страницы (с 1).
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: Размер страницы.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Forbidden:
      description: Роль не имеет доступа к операции.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: Недостаточно прав
    NotFound:
      description: Объект не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Объект не найден
    ValidationError:
      description: Некорректные параметры запроса.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: Некорректные параметры запроса
  schemas:
    Error:
      type: object
      description: Единый формат ошибок для всех эндпоинтов.
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки (каталог — в описании API).
        message:
          type: string
          description: Сообщение, пригодное для показа пользователю.
        details:
          type: object
          additionalProperties: true
          description: Контекст ошибки (например, текущий владелец клиента).
    Role:
      type: string
      description: Роль пользователя (`spec.md` §2.1).
      enum:
      - ADMIN
      - OPERATOR
    User:
      type: object
      description: Пользователь (`spec.md` §2.1).
      required:
      - id
      - login
      - role
      - is_active
      - created_at
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
    UserCreate:
      type: object
      required:
      - login
      - password
      - role
      properties:
        login:
          type: string
          description: Уникальный логин.
        password:
          type: string
          format: password
          description: Пароль; хранится только как `password_hash`.
        role:
          $ref: '#/components/schemas/Role'
    UserListResponse:
      type: object
      required:
      - items
      - page
      - page_size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    LoginRequest:
      type: object
      required:
      - login
      - password
      properties:
        login:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required:
      - token
      - token_type
      - expires_in
      - user
      properties:
        token:
          type: string
          description: 'JWT для заголовка `Authorization: Bearer`.'
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          description: Время жизни токена, секунды.
        user:
          $ref: '#/components/schemas/User'
    Tag:
      type: string
      description: Признак клиента — справочник тегов (`spec.md` §2.2, docs/db).
      enum:
      - VIP
      - NOVICE
      - INTEGRATOR
      - TECH_PARTNER
      - MPP
      - DO_NOT_WORK
    ClientStatus:
      type: string
      description: Статус клиента (`spec.md` §2.2).
      enum:
      - ACTIVE
      - INACTIVE
    Stage:
      type: string
      description: Этап работы по клиенту (`spec.md` §2.2).
      enum:
      - POOL
      - IN_WORK
      - WAIT_DEADLINE
      - CLAIM
      - CLOSED
    Dynamics:
      type: string
      description: Динамика числа непереданных документов между срезами (`spec.md` §3.3).
      enum:
      - REDUCING
      - NO_CHANGE
      - GROWING
      - ALL_SUBMITTED
    NullableDynamics:
      description: Динамика; `null`, если срезов меньше двух.
      oneOf:
      - $ref: '#/components/schemas/Dynamics'
      - type: 'null'
    Duration:
      type: string
      description: FIRST_TIME — первое ненулевое наблюдение нового непрерывного периода непереданных документов
        клиента. REPEATED — следующее ненулевое наблюдение в том же непрерывном периоде, пока не достигнута длительная
        задержка. LONG_DELAY_2Q имеет приоритет при двух последовательных кварталах задержки. Частичная передача
        не начинает новый период. Полное обнуление остатка по всем исходным кварталам завершает период; последующее
        появление непереданных документов снова даёт FIRST_TIME. При нуле категория задержки отсутствует. Отсутствие
        данных не считается нулём; повтор пакета не считается новым наблюдением.
      enum:
      - FIRST_TIME
      - REPEATED
      - LONG_DELAY_2Q
    QuarterSnapshotBrief:
      type: object
      description: Последний срез клиента по кварталу (`spec.md` §2.3).
      required:
      - quarter
      - total_documents
      - unsubmitted_documents
      - snapshot_date
      properties:
        quarter:
          type: string
          description: Квартал, формат `ГГГГ_QN`.
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q1
        total_documents:
          type: integer
          minimum: 0
          description: Всего документов; фиксируется при первой загрузке квартала (`spec.md` §1.2).
        unsubmitted_documents:
          type: integer
          minimum: 0
          description: Непереданные документы; обновляется срезами.
        snapshot_date:
          type: string
          format: date
        last_observation_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q2
    ClientListItem:
      type: object
      description: Строка общей таблицы клиентов.
      required:
      - kcr_code
      - inn
      - organization_name
      - status
      - tags
      - current_stage
      - assigned_operator_id
      - dynamics
      - latest_snapshot
      - dynamics_quarter
      - dynamics_previous_quarter
      - dynamics_current_documents
      - dynamics_previous_documents
      - quarter_summary
      properties:
        assignment_id: { type: [string, 'null'], format: uuid }
        work_quarter:
          type:
          - string
          - 'null'
          pattern: ^\d{4}_Q[1-4]$
          description: Квартал цикла обзвона; может отличаться от кварталов документов.
        kcr_code:
          type: string
          description: Код КЦР — первичный бизнес-ключ.
        inn:
          type:
          - string
          - 'null'
          description: ИНН; один ИНН может иметь несколько Кодов КЦР.
        kpp:
          type:
          - string
          - 'null'
        organization_name:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/ClientStatus'
        is_blocked:
          type: boolean
        manager_name:
          type:
          - string
          - 'null'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        current_stage:
          $ref: '#/components/schemas/Stage'
        assigned_operator_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Оператор, за которым закреплён клиент; `null` — клиент свободен.
        dynamics:
          $ref: '#/components/schemas/NullableDynamics'
          description: Сравнение актуальных остатков quarter и предыдущего исходного квартала. Нет одного периода
            — null; текущий ноль при известной паре — ALL_SUBMITTED.
        latest_snapshot:
          oneOf:
          - $ref: '#/components/schemas/QuarterSnapshotBrief'
          - type: 'null'
          description: Последний срез; `null`, если срезов ещё нет.
        needs_review:
          type: boolean
          description: Проверить унаследованные/неполные сведения
        inherited_fields:
          type: object
          additionalProperties: true
          description: Поле → источник (квартал, пакет, дата)
        wait_until:
          type:
          - string
          - 'null'
          format: date
          description: Срок оператора; защита действует до этой даты, включая смену квартала
        wait_source_work_quarter:
          type:
          - string
          - 'null'
          description: Исходный цикл защищённого ожидания
        outstanding_documents:
          type: integer
          minimum: 0
          description: Сумма по уникальным исходным периодам без повторного счёта переноса
        duration:
          description: Категория непрерывного периода клиента; null при нулевом остатке. См. ADR-0003.
          oneOf:
          - $ref: '#/components/schemas/Duration'
          - type: 'null'
        dynamics_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
        dynamics_previous_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
        dynamics_current_documents:
          type:
          - integer
          - 'null'
          minimum: 0
        dynamics_previous_documents:
          type:
          - integer
          - 'null'
          minimum: 0
        quarter_summary:
          description: Выбранный quarter; отсутствие периода — null. Общий остаток всех периодов отдельно.
          oneOf:
          - $ref: '#/components/schemas/QuarterSummary'
          - type: 'null'
    ClientListResponse:
      type: object
      required:
      - items
      - page
      - page_size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientListItem'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    QuarterSnapshot:
      type: object
      description: Актуальный срез квартала (`spec.md` §2.3).
      required:
      - kcr_code
      - quarter
      - total_documents
      - unsubmitted_documents
      - snapshot_date
      properties:
        kcr_code:
          type: string
        quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q1
        total_documents:
          type: integer
          description: Фиксируется при первой загрузке квартала.
        unsubmitted_documents:
          type: integer
          description: Обновляется каждым срезом того же квартала.
        snapshot_date:
          type: string
          format: date
        last_observation_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q2
    ClientAssignmentInfo:
      type: object
      description: Активное закрепление; `null`, если клиент свободен (`spec.md` §2.7).
      required:
      - work_quarter
      - operator_id
      - operator_name
      - assigned_at
      properties:
        work_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          description: Квартал цикла обзвона; может отличаться от кварталов документов.
        operator_id:
          type: string
          format: uuid
        operator_name:
          type: string
          description: Логин оператора (в модели User нет ФИО).
        assigned_at:
          type: string
          format: date-time
    ClientCard:
      type: object
      description: Карточка клиента с полной историей взаимодействия (`spec.md` §3.3, §4.4).
      required:
      - kcr_code
      - inn
      - organization_name
      - status
      - tags
      - current_stage
      - assignment
      - snapshots
      - dynamics_quarter
      - dynamics_previous_quarter
      - dynamics_current_documents
      - dynamics_previous_documents
      - quarter_summary
      properties:
        assignment_id: { type: [string, 'null'], format: uuid }
        work_quarter:
          type:
          - string
          - 'null'
          pattern: ^\d{4}_Q[1-4]$
          description: Квартал цикла обзвона; может отличаться от кварталов документов.
        kcr_code:
          type: string
        inn:
          type:
          - string
          - 'null'
        kpp:
          type:
          - string
          - 'null'
        organization_name:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/ClientStatus'
        is_blocked:
          type: boolean
        manager_name:
          type:
          - string
          - 'null'
        contacts:
          type:
          - object
          - 'null'
          additionalProperties: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        current_stage:
          $ref: '#/components/schemas/Stage'
        assignment:
          oneOf:
          - $ref: '#/components/schemas/ClientAssignmentInfo'
          - type: 'null'
        snapshots:
          type: array
          description: Актуальные срезы по кварталам, свежие первыми.
          items:
            $ref: '#/components/schemas/QuarterSnapshot'
        dynamics:
          $ref: '#/components/schemas/NullableDynamics'
          description: Сравнение актуальных остатков quarter и предыдущего исходного квартала. Нет одного периода
            — null; текущий ноль при известной паре — ALL_SUBMITTED.
        needs_review:
          type: boolean
          description: Проверить унаследованные/неполные сведения
        inherited_fields:
          type: object
          additionalProperties: true
          description: Поле → источник (квартал, пакет, дата)
        wait_until:
          type:
          - string
          - 'null'
          format: date
          description: Срок оператора; защита действует до этой даты, включая смену квартала
        wait_source_work_quarter:
          type:
          - string
          - 'null'
          description: Исходный цикл защищённого ожидания
        outstanding_documents:
          type: integer
          minimum: 0
          description: Сумма по уникальным исходным периодам без повторного счёта переноса
        duration:
          description: Категория непрерывного периода клиента; null при нулевом остатке. См. ADR-0003.
          oneOf:
          - $ref: '#/components/schemas/Duration'
          - type: 'null'
        dynamics_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
        dynamics_previous_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
        dynamics_current_documents:
          type:
          - integer
          - 'null'
          minimum: 0
        dynamics_previous_documents:
          type:
          - integer
          - 'null'
          minimum: 0
        quarter_summary:
          description: Выбранный quarter; отсутствие периода — null. Общий остаток всех периодов отдельно.
          oneOf:
          - $ref: '#/components/schemas/QuarterSummary'
          - type: 'null'
    EventListResponse:
      type: object
      required:
      - items
      - page
      - page_size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientEvent'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    SnapshotHistoryRecord:
      type: object
      description: Запись журнала изменения статуса передачи документов (`spec.md` §2.4).
      required:
      - id
      - kcr_code
      - quarter
      - unsubmitted_documents
      - import_batch_id
      - snapshot_date
      - created_at
      properties:
        id:
          type: string
          format: uuid
        kcr_code:
          type: string
        quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q1
        unsubmitted_documents:
          type: integer
          minimum: 0
          description: Значение непереданных документов после изменения.
        import_batch_id:
          type: string
          format: uuid
          description: Пакет, вызвавший изменение.
        snapshot_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        observation_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q2
        observation_order:
          type: integer
          description: Порядок исправлений одной даты.
        inherited_fields:
          type: object
          additionalProperties: true
    SnapshotHistoryResponse:
      type: object
      required:
      - items
      - page
      - page_size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotHistoryRecord'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    EventType:
      type: string
      description: Тип события ленты (`spec.md` §2.4).
      enum:
      - CALL_RESULT
      - HISTORICAL_COMMENT
      - EMAIL_SENT
      - STAGE_CHANGE
      - CLAIM_UPDATE
      - OPERATOR_ASSIGN
    CallResult:
      type: string
      description: Результат звонка (`spec.md` §2.4).
      enum:
      - AGREEMENT
      - REFUSAL
      - NO_ANSWER
      - WRONG_NUMBER
    CallEventCreate:
      type: object
      additionalProperties: false
      required: [event_type, request_id, expected_assignment_id, work_quarter, call_result]
      properties:
        document_quarters:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Явно выбранные исходные кварталы документов. Пустой список означает общее событие или отсутствие подтверждённой привязки.
          items: { type: string, pattern: '^[0-9]{4}_Q[1-4]$' }
        event_type: { const: CALL_RESULT }
        request_id:
          type: string
          format: uuid
          description: Сохраняется при повторе запроса.
        expected_assignment_id:
          type: string
          format: uuid
          description: Назначение, под которым оператор открыл форму.
        work_quarter: { type: string, pattern: '^[0-9]{4}_Q[1-4]$' }
        call_result:
          $ref: '#/components/schemas/CallResult'
        comment_text: { type: string, maxLength: 4000, default: '' }
        promised_date: { type: [string, 'null'], format: date }
        wait_until:
          type: [string, 'null']
          format: date
          description: Будущая дата ожидания по Москве. Применяется только при актуальном назначении.
    HistoricalCommentCreate:
      type: object
      additionalProperties: false
      required: [event_type, request_id, comment_text, historical_event_date]
      properties:
        document_quarters:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Явно выбранные исходные кварталы документов. Пустой список означает общее событие или отсутствие подтверждённой привязки.
          items: { type: string, pattern: '^[0-9]{4}_Q[1-4]$' }
        event_type: { const: HISTORICAL_COMMENT }
        request_id:
          type: string
          format: uuid
          description: Сохраняется при повторной отправке.
        comment_text: { type: string, minLength: 1, maxLength: 4000 }
        historical_event_date:
          type: string
          format: date-time
          description: Фактическая дата и время события в прошлом с часовым поясом.
        work_quarter:
          type: [string, 'null']
          pattern: '^[0-9]{4}_Q[1-4]$'
          description: Текущий квартал работы или null для общей истории клиента.
    SavedCallEvent:
      allOf:
      - $ref: '#/components/schemas/ClientEvent'
      - type: object
        required: [wait_applied]
        properties:
          event_type: { const: CALL_RESULT }
          wait_applied: { type: boolean }
    SavedHistoricalComment:
      allOf:
      - $ref: '#/components/schemas/ClientEvent'
      - type: object
        required: [historical_event_date]
        properties:
          event_type: { const: HISTORICAL_COMMENT }
          historical_event_date: { type: string, format: date-time }
    ClientEventCreate:
      type: object
      description: Создание события (`spec.md` §3.3).
      required:
      - event_type
      - comment_text
      allOf:
      - if:
          properties:
            event_type:
              enum:
              - CALL_RESULT
              - EMAIL_SENT
              - STAGE_CHANGE
              - CLAIM_UPDATE
              - OPERATOR_ASSIGN
          required:
          - event_type
        then:
          required:
          - work_quarter
          properties:
            work_quarter:
              type: string
      - if:
          properties:
            stage:
              const: WAIT_DEADLINE
          required:
          - stage
        then:
          required:
          - wait_until
          properties:
            wait_until:
              type: string
              format: date
      - if:
          properties:
            event_type:
              const: STAGE_CHANGE
          required:
          - event_type
        then:
          required:
          - stage
      properties:
        work_quarter:
          type:
          - string
          - 'null'
          pattern: ^\d{4}_Q[1-4]$
          description: Квартал цикла обзвона; может отличаться от кварталов документов.
        event_type:
          $ref: '#/components/schemas/EventType'
        call_result:
          $ref: '#/components/schemas/CallResult'
          description: Обязателен при `event_type = CALL_RESULT`.
        promised_date:
          type:
          - string
          - 'null'
          format: date
          description: Обещанный срок передачи оригиналов.
        comment_text:
          type: string
        historical_event_date:
          type:
          - string
          - 'null'
          format: date-time
          description: Дата в прошлом; заполняется оператором для «прошлого комментария».
        wait_until:
          type:
          - string
          - 'null'
          format: date
          description: Дата, устанавливаемая оператором при переходе в WAIT_DEADLINE
        stage:
          type: string
          enum:
          - POOL
          - IN_WORK
          - WAIT_DEADLINE
          - CLAIM
          - CLOSED
          description: Новый этап для STAGE_CHANGE; WAIT_DEADLINE требует wait_until.
    ClientEvent:
      type: object
      description: Событие ленты клиента (`spec.md` §2.4).
      required:
      - id
      - kcr_code
      - author_id
      - event_type
      - comment_text
      - created_at
      properties:
        document_quarters:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Явно выбранные исходные кварталы документов. Пустой список означает общее событие или отсутствие подтверждённой привязки.
          items: { type: string, pattern: '^[0-9]{4}_Q[1-4]$' }
        work_quarter:
          type:
          - string
          - 'null'
          pattern: ^\d{4}_Q[1-4]$
          description: Квартал цикла обзвона; может отличаться от кварталов документов.
        id:
          type: string
          format: uuid
        kcr_code:
          type: string
        author_id:
          type: string
          format: uuid
        event_type:
          $ref: '#/components/schemas/EventType'
        call_result:
          oneOf:
          - $ref: '#/components/schemas/CallResult'
          - type: 'null'
        promised_date:
          type:
          - string
          - 'null'
          format: date
        comment_text:
          type: string
        historical_event_date:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        stage:
          type:
          - string
          - 'null'
        wait_until:
          type:
          - string
          - 'null'
          format: date
    TakeRequest:
      type: object
      required: [expected_assignment_id, request_id]
      properties:
        expected_assignment_id:
          type: [string, 'null']
          format: uuid
          description: ID назначения из карточки или null для свободного клиента.
        request_id:
          type: string
          format: uuid
          description: ID операции, сохраняемый при повторе после сетевого сбоя.
    ReassignmentRequest:
      type: object
      required: [id, kcr_code, work_quarter, expected_assignment_id, owner_id, requester_id, created_at, expires_at, status, resolved_at]
      properties:
        id: { type: string, format: uuid }
        kcr_code: { type: string }
        work_quarter: { type: string }
        expected_assignment_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        requester_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [PENDING, REJECTED, TRANSFERRED, CANCELLED] }
    TakeResponse:
      type: object
      description: Результат атомарного закрепления (`spec.md` §2.7 `ClientAssignment`).
      required:
      - work_quarter
      - kcr_code
      - assignment_id
      - assigned_operator_id
      - assigned_at
      properties:
        work_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          description: Квартал цикла обзвона; может отличаться от кварталов документов.
        kcr_code:
          type: string
        assignment_id: { type: string, format: uuid }
        assigned_operator_id:
          type: string
          format: uuid
        assigned_at:
          type: string
          format: date-time
    ImportBatch:
      type: object
      description: Пакет с выбранным кварталом и результатами. Отчёт содержит ошибки; rollback разрешён только для
        последнего применённого пакета.
      required:
      - id
      - uploaded_by
      - filename
      - status
      - total_rows
      - success_count
      - error_count
      - created_at
      - selected_quarter
      - import_type
      - snapshot_date
      properties:
        id:
          type: string
          format: uuid
        uploaded_by:
          type: string
          format: uuid
        filename:
          type: string
        status:
          type: string
          enum:
          - PROCESSING
          - COMPLETED
          - ROLLED_BACK
          - FAILED
        total_rows:
          type: integer
        success_count:
          type: integer
        error_count:
          type: integer
        created_at:
          type: string
          format: date-time
        selected_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q2
        import_type:
          type: string
          enum:
          - REGISTRY
          - SNAPSHOT
        snapshot_date:
          type: string
          format: date
    AssistantSummaryResponse:
      type: object
      required:
      - kcr_code
      - summary
      - generated_at
      properties:
        kcr_code:
          type: string
        summary:
          type: string
          description: Сводка «Контекст перед звонком», 5–7 строк (`spec.md` §3.4).
          example: 'VIP-клиент, закреплён за petrov.

            Непереданных документов: 12 из 40 (2026_Q1).

            Динамика: GROWING два среза подряд.

            Последний звонок 2026-01-28: AGREEMENT, обещал 2026-02-10.

            Обещанный срок истёк.'
        generated_at:
          type: string
          format: date-time
    FilterQueryRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
          description: Запрос на естественном языке.
          example: Не VIP, непереданных >25%, без изменений
    FilterQueryResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - kcr_code
            - reason
            properties:
              kcr_code:
                type: string
              reason:
                type: string
                description: Текстовая причина соответствия запросу.
                example: Не VIP, непереданных 32%, динамика NO_CHANGE
    ChatRequest:
      type: object
      required:
      - kcr_code
      - message
      properties:
        kcr_code:
          type: string
          description: Клиент, по которому задаётся вопрос.
        message:
          type: string
          minLength: 1
    EventReference:
      type: object
      description: Ссылка на событие, на котором основан ответ (`spec.md` §3.4).
      required:
      - event_id
      - event_date
      properties:
        event_id:
          type: string
          format: uuid
        event_date:
          type: string
          format: date-time
          description: Дата события (`historical_event_date`, если заполнена, иначе `created_at`).
    ChatResponse:
      type: object
      required:
      - answer
      - event_references
      properties:
        answer:
          type: string
          description: Ответ строго на основе контекста БД по клиенту.
        event_references:
          type: array
          items:
            $ref: '#/components/schemas/EventReference'
          description: Обязательные ссылки на даты событий; может быть пустым.
    RecoveryCommand:
      type: object
      additionalProperties: false
      required:
      - operation_id
      properties:
        operation_id:
          type: string
          format: uuid
    QuarterSummary:
      type: object
      required:
      - quarter
      - total_documents
      - unsubmitted_documents
      - unsubmitted_percent
      properties:
        quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
        total_documents:
          type: integer
          minimum: 0
        unsubmitted_documents:
          type: integer
          minimum: 0
        unsubmitted_percent:
          type:
          - number
          - 'null'
          minimum: 0
          description: unsubmitted_documents/total_documents*100; при нулевом total — null. Значение не ограничивается
            искусственно 100.
