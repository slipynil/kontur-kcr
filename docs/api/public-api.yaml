openapi: 3.1.0
info:
  title: Контур КЦР — Публичное API (внешний контур)
  version: 1.4.0
  summary: Единое внешнее API системы «Контур КЦР» через Gateway / Identity Service.
  description: |
    Актуальные правила — spec.md 1.4 и ADR-0002 (уточнения пользователя от 05.11.2026).
    Квартал выбирается пользователем при загрузке; дата файла и имя листа не назначают его автоматически.
    Периоды только квартальные. Непереданные документы учитываются в следующих кварталах под исходным периодом без двойного счёта.
    Два квартала непрерывной задержки и более — LONG_DELAY_2Q.
    WAIT_DEADLINE с ещё не наступившей датой оператора сохраняет ответственного, включая новый квартал.
    По наступлении даты при остатке клиент доступен в POOL. Пустые поля наследуются с needs_review и происхождением.
    Rollback только последнего пакета; ручное удаление очищает также начатую работу операторов.
    ИИ использует облачный API стороннего провайдера; конкретные функции отложены до отдельного обсуждения.

    Публичные операции требуют Bearer JWT; ADMIN управляет импортом/удалением, OPERATOR работает в пуле.
servers:
- url: https://{host}
  description: Единая внешняя точка входа (nginx → Gateway / Identity).
  variables:
    host:
      default: kcr.example.local
      description: Имя хоста окружения (тестовые данные, внешний контур недоступен из интернета).
tags:
- name: Auth
  description: Аутентификация. Обрабатывает Gateway / Identity Service.
- name: Users
  description: Управление пользователями и ролями. Только Admin. Gateway / Identity Service.
- name: Imports
  description: Импорт из Excel. Проксируется в Import Worker.
- name: Clients
  description: Реестр клиентов. Проксируется в Clients Service.
- name: OperatorWork
  description: Рабочее место оператора. Проксируется в Operator Work Service.
- name: Assistant
  description: Облачный ИИ; операции являются предложениями до согласования функций.
security:
- bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: Аутентификация
      description: Проверяет логин и пароль, выдаёт JWT и карточку пользователя.
      security: []
      x-roles:
      - ADMIN
      - OPERATOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: ivanov
              password: '********'
      responses:
        '200':
          description: Успешная аутентификация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Неверный логин или пароль.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_CREDENTIALS
                message: Неверный логин или пароль
  /api/v1/users:
    get:
      tags:
      - Users
      operationId: listUsers
      summary: Список пользователей
      description: Реестр пользователей с ролями. Только Admin (`spec.md` §3.1).
      x-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Список пользователей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Users
      operationId: createUser
      summary: Создать пользователя
      description: Создание учётной записи с ролью. Только Admin (`spec.md` §3.1).
      x-roles:
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            example:
              login: petrov
              password: '********'
              role: OPERATOR
      responses:
        '201':
          description: Пользователь создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Логин уже занят.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: LOGIN_ALREADY_EXISTS
                message: Логин уже занят
  /api/v1/imports/{batch_id}/rollback:
    post:
      tags:
      - Imports
      operationId: rollbackImport
      summary: Откатить импорт
      description: Отменить только последний применённый неотменённый пакет в системе. Созданные данные и связанная
        работа операторов удаляются; прежние значения обновлённых записей восстанавливаются. Другой пакет ->
        409 IMPORT_NOT_LATEST. Начатая работа не блокирует откат. Завершение только после согласованной очистки
        сервисов.
      x-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Пакет откачен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
              example:
                id: 3f0b2a1e-8c4d-4c1a-9f2e-6b7d5a4c3e21
                uploaded_by: 11111111-1111-1111-1111-111111111111
                filename: reestr_2026_Q1.xlsx
                status: ROLLED_BACK
                total_rows: 1200
                success_count: 1180
                error_count: 20
                created_at: '2026-01-15T09:30:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Пакет не последний или имеет недопустимый статус.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: IMPORT_NOT_LATEST
                message: Можно отменить только последний применённый пакет
  /api/v1/clients:
    get:
      tags:
      - Clients
      operationId: listClients
      summary: Реестр клиентов
      description: |
        Общая таблица клиентов с фильтрацией (`spec.md` §3.3). Возвращает бизнес-ключ
        `kcr_code` (Код КЦР), признаки, последний срез по кварталу и рассчитанную
        динамику. Один ИНН может иметь несколько Кодов КЦР (`spec.md` §1.2).
      x-roles:
      - ADMIN
      - OPERATOR
      parameters:
      - name: work_quarter
        in: query
        required: false
        description: Квартал обзвона. Для списка/карточки без фильтра используется последний цикл; лента без
          фильтра объединяет все циклы.
        schema:
          type: string
          pattern: ^\d{4}_Q[1-4]$
      - name: search
        in: query
        description: Поиск по Коду КЦР или ИНН (`spec.md` §3.3).
        schema:
          type: string
        example: '6671'
      - name: dynamics
        in: query
        description: |
          Динамика числа непереданных документов; рассчитывается автоматически
          по журналу изменений статуса передачи документов — две последние
          записи выбранного исходного квартала (`spec.md` §3.3).
        schema:
          $ref: '#/components/schemas/Dynamics'
        example: GROWING
      - name: duration
        in: query
        description: Длительность непередачи документов.
        schema:
          $ref: '#/components/schemas/Duration'
        example: REPEATED
      - name: tags
        in: query
        description: Признаки клиента, перечисленные через запятую (`spec.md` §3.3).
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        style: form
        explode: false
        example:
        - VIP
        - NOVICE
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница реестра.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/clients/{kcr_code}/snapshots/history:
    get:
      tags:
      - Clients
      operationId: listSnapshotHistory
      summary: Журнал изменения статуса передачи документов
      description: |
        Append-only журнал: одна запись на каждое новое наблюдение числа непереданных
        документов при импорте (`spec.md` §2.4). Свежие первыми; используется
        карточкой клиента (`spec.md` §4.4) и расчётом динамики.
      x-roles:
      - ADMIN
      - OPERATOR
      parameters:
      - $ref: '#/components/parameters/KcrCode'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница журнала изменений.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotHistoryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/clients/{kcr_code}/take:
    post:
      tags:
      - OperatorWork
      operationId: takeClient
      summary: Взять или перезакрепить клиента на себя
      description: |
        Взять/перезакрепить клиента себе в выбранном work_quarter. Другой ответственный сам по себе не препятствует операции.
        Если существует действующее ожидание (business_date < wait_until), сохраняются WAIT_DEADLINE и тот же оператор, даже при смене квартала.
        Другой оператор получает 409 CLIENT_WAIT_DEADLINE_ACTIVE. Запрос того же ответственного идемпотентен.
        По наступлении даты при остатке документов ожидание нормализуется в POOL без активного назначения; клиент доступен для взятия.
        Срок не продлевается автоматически. Проверка даты, нормализация и назначение атомарны; business_date — Europe/Moscow.
        Исторический квартал нельзя сделать текущим запросом take; 409 INVALID_STATE. Удалённые данные недоступны.
      x-roles:
      - OPERATOR
      parameters:
      - $ref: '#/components/parameters/WorkQuarter'
      - $ref: '#/components/parameters/KcrCode'
      responses:
        '200':
          description: Клиент закреплён за текущим оператором.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ещё действует WAIT_DEADLINE, либо указан исторический/недопустимый цикл.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: CLIENT_WAIT_DEADLINE_ACTIVE
                message: Срок ожидания, установленный оператором, ещё не наступил
                details:
                  work_quarter: 2026_Q2
                  wait_source_work_quarter: 2026_Q1
                  stage: WAIT_DEADLINE
                  wait_until: '2026-07-15'
                  operator_name: petrov
  /api/v1/clients/{kcr_code}:
    get:
      tags:
      - Clients
      operationId: getClientCard
      summary: Карточка клиента
      description: |
        Карточка с полной историей взаимодействия (`spec.md` §3.3, §4.4): профиль
        и теги, актуальные срезы по кварталам, закрепление, этап. Лента событий и
        журнал изменений статуса передачи документов — подчинёнными эндпоинтами.
        Gateway агрегирует данные Clients Service и Operator Work Service.
      x-roles:
      - ADMIN
      - OPERATOR
      parameters:
      - name: work_quarter
        in: query
        required: false
        description: Квартал обзвона. Для списка/карточки без фильтра используется последний цикл; лента без
          фильтра объединяет все циклы.
        schema:
          type: string
          pattern: ^\d{4}_Q[1-4]$
      - $ref: '#/components/parameters/KcrCode'
      responses:
        '200':
          description: Карточка клиента.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCard'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteClient
      summary: Удалить клиента целиком
      description: |
        Разрешённая административная очистка выбранных данных. Удаление клиента очищает все его срезы, циклы, события, назначения и сроки.
        Удаление квартальных данных очищает связанные записи и перенесённую работу этого объекта; другие клиенты не затрагиваются.
        Начатая работа оператора не блокирует удаление. Ответ об успехе — только после очистки всех затронутых сервисов и кэшей.
      parameters:
      - name: kcr_code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Данные и связанная работа удалены; успех только после межсервисной очистки.
        '404':
          description: Объект не найден.
      x-roles:
      - ADMIN
  /api/v1/clients/{kcr_code}/events:
    get:
      tags:
      - OperatorWork
      operationId: listClientEvents
      summary: Лента событий клиента
      description: |-
        История взаимодействия (звонки, комментарии, письма, смены этапов,
        закрепления), свежие первыми (`spec.md` §3.3, §4.4). Включает события
        прошлых дат (`historical_event_date`).

        История обычно сохраняется, но удаляется вместе с явно удалёнными данными клиента/квартала и при последнем rollback.
      x-roles:
      - ADMIN
      - OPERATOR
      parameters:
      - name: work_quarter
        in: query
        required: false
        description: Квартал обзвона. Для списка/карточки без фильтра используется последний цикл; лента без
          фильтра объединяет все циклы.
        schema:
          type: string
          pattern: ^\d{4}_Q[1-4]$
      - $ref: '#/components/parameters/KcrCode'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница ленты событий.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - OperatorWork
      operationId: createClientEvent
      summary: Добавить событие клиента
      description: |-
        Для нового звонка/смены этапа/закрепления обязателен work_quarter текущего цикла.
        NULL разрешён для старого комментария без установленного цикла.
        Добавление события в ленту: результат звонка, комментарий прошлой даты
        (с ручной датой `historical_event_date`) и другие типы событий
        (`spec.md` §3.3, §2.4).

        История обычно сохраняется, но удаляется вместе с явно удалёнными данными клиента/квартала и при последнем rollback.
      x-roles:
      - ADMIN
      - OPERATOR
      parameters:
      - $ref: '#/components/parameters/KcrCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientEventCreate'
            example:
              event_type: CALL_RESULT
              work_quarter: 2026_Q1
              call_result: AGREEMENT
              promised_date: '2026-02-10'
              comment_text: Договорились передать оригиналы до 10 февраля
      responses:
        '201':
          description: Событие создано.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientEvent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/assistant/summary/{kcr_code}:
    get:
      tags:
      - Assistant
      operationId: getAssistantSummary
      summary: Сводка «Контекст перед звонком» [Функции не согласованы]
      description: Предложение API; конкретная функция и её приёмочные критерии отложены до отдельного обсуждения.
        Модель вызывается через облачный API стороннего провайдера. Удалённые данные исключаются из контекста.
      x-roles:
      - ADMIN
      - OPERATOR
      parameters:
      - $ref: '#/components/parameters/KcrCode'
      responses:
        '200':
          description: Сводка по клиенту.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantSummaryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      x-status: proposal-pending-ai-scope
  /api/v1/assistant/filter-query:
    post:
      tags:
      - Assistant
      operationId: assistantFilterQuery
      summary: Отбор словами [Функции не согласованы]
      description: Предложение API; конкретная функция и её приёмочные критерии отложены до отдельного обсуждения.
        Модель вызывается через облачный API стороннего провайдера. Удалённые данные исключаются из контекста.
      x-roles:
      - ADMIN
      - OPERATOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterQueryRequest'
            example:
              query: Не VIP, непереданных >25%, без изменений
      responses:
        '200':
          description: Подобранные клиенты с причинами соответствия.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterQueryResponse'
        '400':
          description: Запрос не удалось разобрать.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_QUERY
                message: Не удалось разобрать текст запроса
      x-status: proposal-pending-ai-scope
  /api/v1/assistant/chat:
    post:
      tags:
      - Assistant
      operationId: assistantChat
      summary: Вопрос по карточке клиента [Функции не согласованы]
      description: Предложение API; конкретная функция и её приёмочные критерии отложены до отдельного обсуждения.
        Модель вызывается через облачный API стороннего провайдера. Удалённые данные исключаются из контекста.
      x-roles:
      - ADMIN
      - OPERATOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              kcr_code: 6671-0042
              message: Обещал ли клиент передать оригиналы и когда?
      responses:
        '200':
          description: Ответ ассистента со ссылками на события.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      x-status: proposal-pending-ai-scope
  /api/v1/imports:
    post:
      tags:
      - Imports
      operationId: uploadImport
      summary: Загрузить Excel с выбором квартала
      description: Загрузить REGISTRY/SNAPSHOT. Квартал и дата среза указываются пользователем; дата файла/имя
        листа не назначают период.
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - selected_quarter
              - import_type
              - snapshot_date
              properties:
                file:
                  type: string
                  format: binary
                  description: Excel-файл `.xlsx`.
                selected_quarter:
                  type: string
                  pattern: ^\d{4}_Q[1-4]$
                  example: 2026_Q2
                import_type:
                  type: string
                  enum:
                  - REGISTRY
                  - SNAPSHOT
                snapshot_date:
                  type: string
                  format: date
      responses:
        '202':
          description: Файл принят в обработку.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '400':
          description: Файл не передан или не является `.xlsx`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - ADMIN
  /api/v1/imports/{batch_id}:
    get:
      tags:
      - Imports
      operationId: getImport
      summary: Отчёт о пакете [Предложение]
      description: |
        Сводка импорта для дашборда (`spec.md` §4.1): счётчики успешно/ошибок и
        строки `import_errors` с причинами отсева (для виджета скачивания
        `.xlsx` с ошибками).
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Пакет найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '404':
          description: Пакет не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - ADMIN
  /api/v1/clients/{kcr_code}/snapshots/{quarter}:
    delete:
      operationId: deleteClientQuarter
      summary: Удалить выбранные квартальные данные
      description: |
        Разрешённая административная очистка выбранных данных. Удаление клиента очищает все его срезы, циклы, события, назначения и сроки.
        Удаление квартальных данных очищает связанные записи и перенесённую работу этого объекта; другие клиенты не затрагиваются.
        Начатая работа оператора не блокирует удаление. Ответ об успехе — только после очистки всех затронутых сервисов и кэшей.
      parameters:
      - name: kcr_code
        in: path
        required: true
        schema:
          type: string
      - name: quarter
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q2
      responses:
        '200':
          description: Данные и связанная работа удалены; успех только после межсервисной очистки.
        '404':
          description: Объект не найден.
      x-roles:
      - ADMIN
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WorkQuarter:
      name: work_quarter
      in: query
      required: true
      description: Квартал данных, выбранный при загрузке. Действующее ожидание предыдущего цикла сохраняет
        ответственного до wait_until.
      schema:
        type: string
        pattern: ^\d{4}_Q[1-4]$
      example: 2026_Q4
    KcrCode:
      name: kcr_code
      in: path
      required: true
      description: Код КЦР — первичный бизнес-ключ клиента (`spec.md` §1.2).
      schema:
        type: string
      example: 6671-0042
    BatchId:
      name: batch_id
      in: path
      required: true
      description: Идентификатор пакета импорта (`ImportBatch.id`).
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Номер страницы (с 1).
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: Размер страницы.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Forbidden:
      description: Роль не имеет доступа к операции.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: Недостаточно прав
    NotFound:
      description: Объект не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Объект не найден
    ValidationError:
      description: Некорректные параметры запроса.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: Некорректные параметры запроса
  schemas:
    Error:
      type: object
      description: Единый формат ошибок для всех эндпоинтов.
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки (каталог — в описании API).
        message:
          type: string
          description: Сообщение, пригодное для показа пользователю.
        details:
          type: object
          additionalProperties: true
          description: Контекст ошибки (например, текущий владелец клиента).
    Role:
      type: string
      description: Роль пользователя (`spec.md` §2.1).
      enum:
      - ADMIN
      - OPERATOR
    User:
      type: object
      description: Пользователь (`spec.md` §2.1).
      required:
      - id
      - login
      - role
      - is_active
      - created_at
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
    UserCreate:
      type: object
      required:
      - login
      - password
      - role
      properties:
        login:
          type: string
          description: Уникальный логин.
        password:
          type: string
          format: password
          description: Пароль; хранится только как `password_hash`.
        role:
          $ref: '#/components/schemas/Role'
    UserListResponse:
      type: object
      required:
      - items
      - page
      - page_size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    LoginRequest:
      type: object
      required:
      - login
      - password
      properties:
        login:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required:
      - token
      - token_type
      - expires_in
      - user
      properties:
        token:
          type: string
          description: 'JWT для заголовка `Authorization: Bearer`.'
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          description: Время жизни токена, секунды.
        user:
          $ref: '#/components/schemas/User'
    Tag:
      type: string
      description: Признак клиента — справочник тегов (`spec.md` §2.2, docs/db).
      enum:
      - VIP
      - NOVICE
      - INTEGRATOR
      - TECH_PARTNER
      - MPP
      - DO_NOT_WORK
    ClientStatus:
      type: string
      description: Статус клиента (`spec.md` §2.2).
      enum:
      - ACTIVE
      - INACTIVE
    Stage:
      type: string
      description: Этап работы по клиенту (`spec.md` §2.2).
      enum:
      - POOL
      - IN_WORK
      - WAIT_DEADLINE
      - CLAIM
      - CLOSED
    Dynamics:
      type: string
      description: Динамика числа непереданных документов между срезами (`spec.md` §3.3).
      enum:
      - REDUCING
      - NO_CHANGE
      - GROWING
      - ALL_SUBMITTED
    NullableDynamics:
      description: Динамика; `null`, если срезов меньше двух.
      oneOf:
      - $ref: '#/components/schemas/Dynamics'
      - type: 'null'
    Duration:
      type: string
      description: 'LONG_DELAY_2Q: два квартала непрерывной задержки и более; частичная передача не обнуляет
        длительность. FIRST_TIME/REPEATED требуют отдельного уточнения.'
      enum:
      - FIRST_TIME
      - REPEATED
      - LONG_DELAY_2Q
    QuarterSnapshotBrief:
      type: object
      description: Последний срез клиента по кварталу (`spec.md` §2.3).
      required:
      - quarter
      - total_documents
      - unsubmitted_documents
      - snapshot_date
      properties:
        quarter:
          type: string
          description: Квартал, формат `ГГГГ_QN`.
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q1
        total_documents:
          type: integer
          minimum: 0
          description: Всего документов; фиксируется при первой загрузке квартала (`spec.md` §1.2).
        unsubmitted_documents:
          type: integer
          minimum: 0
          description: Непереданные документы; обновляется срезами.
        snapshot_date:
          type: string
          format: date
        last_observation_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q2
    ClientListItem:
      type: object
      description: Строка общей таблицы клиентов.
      required:
      - kcr_code
      - inn
      - organization_name
      - status
      - tags
      - current_stage
      - assigned_operator_id
      - dynamics
      - latest_snapshot
      properties:
        work_quarter:
          type:
          - string
          - 'null'
          pattern: ^\d{4}_Q[1-4]$
          description: Квартал цикла обзвона; может отличаться от кварталов документов.
        kcr_code:
          type: string
          description: Код КЦР — первичный бизнес-ключ.
        inn:
          type: string
          description: ИНН; один ИНН может иметь несколько Кодов КЦР.
        kpp:
          type: string
        organization_name:
          type: string
        status:
          $ref: '#/components/schemas/ClientStatus'
        is_blocked:
          type: boolean
        manager_name:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        current_stage:
          $ref: '#/components/schemas/Stage'
        assigned_operator_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Оператор, за которым закреплён клиент; `null` — клиент свободен.
        dynamics:
          $ref: '#/components/schemas/NullableDynamics'
        latest_snapshot:
          oneOf:
          - $ref: '#/components/schemas/QuarterSnapshotBrief'
          - type: 'null'
          description: Последний срез; `null`, если срезов ещё нет.
        needs_review:
          type: boolean
          description: Проверить унаследованные/неполные сведения
        inherited_fields:
          type: object
          additionalProperties: true
          description: Поле → источник (квартал, пакет, дата)
        wait_until:
          type:
          - string
          - 'null'
          format: date
          description: Срок оператора; защита действует до этой даты, включая смену квартала
        wait_source_work_quarter:
          type:
          - string
          - 'null'
          description: Исходный цикл защищённого ожидания
        outstanding_documents:
          type: integer
          minimum: 0
          description: Сумма по уникальным исходным периодам без повторного счёта переноса
    ClientListResponse:
      type: object
      required:
      - items
      - page
      - page_size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientListItem'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    QuarterSnapshot:
      type: object
      description: Актуальный срез квартала (`spec.md` §2.3).
      required:
      - kcr_code
      - quarter
      - total_documents
      - unsubmitted_documents
      - snapshot_date
      properties:
        kcr_code:
          type: string
        quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q1
        total_documents:
          type: integer
          description: Фиксируется при первой загрузке квартала.
        unsubmitted_documents:
          type: integer
          description: Обновляется каждым срезом того же квартала.
        snapshot_date:
          type: string
          format: date
        last_observation_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q2
    ClientAssignmentInfo:
      type: object
      description: Активное закрепление; `null`, если клиент свободен (`spec.md` §2.7).
      required:
      - work_quarter
      - operator_id
      - operator_name
      - assigned_at
      properties:
        work_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          description: Квартал цикла обзвона; может отличаться от кварталов документов.
        operator_id:
          type: string
          format: uuid
        operator_name:
          type: string
          description: Логин оператора (в модели User нет ФИО).
        assigned_at:
          type: string
          format: date-time
    ClientCard:
      type: object
      description: Карточка клиента с полной историей взаимодействия (`spec.md` §3.3, §4.4).
      required:
      - kcr_code
      - inn
      - organization_name
      - status
      - tags
      - current_stage
      - assignment
      - snapshots
      properties:
        work_quarter:
          type:
          - string
          - 'null'
          pattern: ^\d{4}_Q[1-4]$
          description: Квартал цикла обзвона; может отличаться от кварталов документов.
        kcr_code:
          type: string
        inn:
          type:
          - string
          - 'null'
        kpp:
          type:
          - string
          - 'null'
        organization_name:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/ClientStatus'
        is_blocked:
          type: boolean
        manager_name:
          type:
          - string
          - 'null'
        contacts:
          type:
          - object
          - 'null'
          additionalProperties: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        current_stage:
          $ref: '#/components/schemas/Stage'
        assignment:
          oneOf:
          - $ref: '#/components/schemas/ClientAssignmentInfo'
          - type: 'null'
        snapshots:
          type: array
          description: Актуальные срезы по кварталам, свежие первыми.
          items:
            $ref: '#/components/schemas/QuarterSnapshot'
        dynamics:
          $ref: '#/components/schemas/NullableDynamics'
        needs_review:
          type: boolean
          description: Проверить унаследованные/неполные сведения
        inherited_fields:
          type: object
          additionalProperties: true
          description: Поле → источник (квартал, пакет, дата)
        wait_until:
          type:
          - string
          - 'null'
          format: date
          description: Срок оператора; защита действует до этой даты, включая смену квартала
        wait_source_work_quarter:
          type:
          - string
          - 'null'
          description: Исходный цикл защищённого ожидания
        outstanding_documents:
          type: integer
          minimum: 0
          description: Сумма по уникальным исходным периодам без повторного счёта переноса
    EventListResponse:
      type: object
      required:
      - items
      - page
      - page_size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientEvent'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    SnapshotHistoryRecord:
      type: object
      description: Запись журнала изменения статуса передачи документов (`spec.md` §2.4).
      required:
      - id
      - kcr_code
      - quarter
      - unsubmitted_documents
      - import_batch_id
      - snapshot_date
      - created_at
      properties:
        id:
          type: string
          format: uuid
        kcr_code:
          type: string
        quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q1
        unsubmitted_documents:
          type: integer
          minimum: 0
          description: Значение непереданных документов после изменения.
        import_batch_id:
          type: string
          format: uuid
          description: Пакет, вызвавший изменение.
        snapshot_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        observation_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q2
    SnapshotHistoryResponse:
      type: object
      required:
      - items
      - page
      - page_size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotHistoryRecord'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    EventType:
      type: string
      description: Тип события ленты (`spec.md` §2.4).
      enum:
      - CALL_RESULT
      - HISTORICAL_COMMENT
      - EMAIL_SENT
      - STAGE_CHANGE
      - CLAIM_UPDATE
      - OPERATOR_ASSIGN
    CallResult:
      type: string
      description: Результат звонка (`spec.md` §2.4).
      enum:
      - AGREEMENT
      - REFUSAL
      - NO_ANSWER
      - WRONG_NUMBER
    ClientEventCreate:
      type: object
      description: Создание события (`spec.md` §3.3).
      required:
      - event_type
      - comment_text
      allOf:
      - if:
          properties:
            event_type:
              enum:
              - CALL_RESULT
              - EMAIL_SENT
              - STAGE_CHANGE
              - CLAIM_UPDATE
              - OPERATOR_ASSIGN
          required:
          - event_type
        then:
          required:
          - work_quarter
          properties:
            work_quarter:
              type: string
      - if:
          properties:
            stage:
              const: WAIT_DEADLINE
          required:
          - stage
        then:
          required:
          - wait_until
          properties:
            wait_until:
              type: string
              format: date
      - if:
          properties:
            event_type:
              const: STAGE_CHANGE
          required:
          - event_type
        then:
          required:
          - stage
      properties:
        work_quarter:
          type:
          - string
          - 'null'
          pattern: ^\d{4}_Q[1-4]$
          description: Квартал цикла обзвона; может отличаться от кварталов документов.
        event_type:
          $ref: '#/components/schemas/EventType'
        call_result:
          $ref: '#/components/schemas/CallResult'
          description: Обязателен при `event_type = CALL_RESULT`.
        promised_date:
          type:
          - string
          - 'null'
          format: date
          description: Обещанный срок передачи оригиналов.
        comment_text:
          type: string
        historical_event_date:
          type:
          - string
          - 'null'
          format: date-time
          description: Дата в прошлом; заполняется оператором для «прошлого комментария».
        wait_until:
          type:
          - string
          - 'null'
          format: date
          description: Дата, устанавливаемая оператором при переходе в WAIT_DEADLINE
        stage:
          type: string
          enum:
          - POOL
          - IN_WORK
          - WAIT_DEADLINE
          - CLAIM
          - CLOSED
          description: Новый этап для STAGE_CHANGE; WAIT_DEADLINE требует wait_until.
    ClientEvent:
      type: object
      description: Событие ленты клиента (`spec.md` §2.4).
      required:
      - id
      - kcr_code
      - author_id
      - event_type
      - comment_text
      - created_at
      properties:
        work_quarter:
          type:
          - string
          - 'null'
          pattern: ^\d{4}_Q[1-4]$
          description: Квартал цикла обзвона; может отличаться от кварталов документов.
        id:
          type: string
          format: uuid
        kcr_code:
          type: string
        author_id:
          type: string
          format: uuid
        event_type:
          $ref: '#/components/schemas/EventType'
        call_result:
          $ref: '#/components/schemas/CallResult'
        promised_date:
          type:
          - string
          - 'null'
          format: date
        comment_text:
          type: string
        historical_event_date:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        stage:
          type:
          - string
          - 'null'
        wait_until:
          type:
          - string
          - 'null'
          format: date
    TakeResponse:
      type: object
      description: Результат атомарного закрепления (`spec.md` §2.7 `ClientAssignment`).
      required:
      - work_quarter
      - kcr_code
      - assigned_operator_id
      - assigned_at
      properties:
        work_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          description: Квартал цикла обзвона; может отличаться от кварталов документов.
        kcr_code:
          type: string
        assigned_operator_id:
          type: string
          format: uuid
        assigned_at:
          type: string
          format: date-time
    ImportBatch:
      type: object
      description: Пакет с выбранным кварталом и результатами. Отчёт содержит ошибки; rollback разрешён только
        для последнего применённого пакета.
      required:
      - id
      - uploaded_by
      - filename
      - status
      - total_rows
      - success_count
      - error_count
      - created_at
      - selected_quarter
      - import_type
      - snapshot_date
      properties:
        id:
          type: string
          format: uuid
        uploaded_by:
          type: string
          format: uuid
        filename:
          type: string
        status:
          type: string
          enum:
          - PROCESSING
          - COMPLETED
          - ROLLED_BACK
          - FAILED
        total_rows:
          type: integer
        success_count:
          type: integer
        error_count:
          type: integer
        created_at:
          type: string
          format: date-time
        selected_quarter:
          type: string
          pattern: ^\d{4}_Q[1-4]$
          example: 2026_Q2
        import_type:
          type: string
          enum:
          - REGISTRY
          - SNAPSHOT
        snapshot_date:
          type: string
          format: date
    AssistantSummaryResponse:
      type: object
      required:
      - kcr_code
      - summary
      - generated_at
      properties:
        kcr_code:
          type: string
        summary:
          type: string
          description: Сводка «Контекст перед звонком», 5–7 строк (`spec.md` §3.4).
          example: |-
            VIP-клиент, закреплён за petrov.
            Непереданных документов: 12 из 40 (2026_Q1).
            Динамика: GROWING два среза подряд.
            Последний звонок 2026-01-28: AGREEMENT, обещал 2026-02-10.
            Обещанный срок истёк.
        generated_at:
          type: string
          format: date-time
    FilterQueryRequest:
      type: object
      required:
      - query
      properties:
        query:
          type: string
          description: Запрос на естественном языке.
          example: Не VIP, непереданных >25%, без изменений
    FilterQueryResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - kcr_code
            - reason
            properties:
              kcr_code:
                type: string
              reason:
                type: string
                description: Текстовая причина соответствия запросу.
                example: Не VIP, непереданных 32%, динамика NO_CHANGE
    ChatRequest:
      type: object
      required:
      - kcr_code
      - message
      properties:
        kcr_code:
          type: string
          description: Клиент, по которому задаётся вопрос.
        message:
          type: string
          minLength: 1
    EventReference:
      type: object
      description: Ссылка на событие, на котором основан ответ (`spec.md` §3.4).
      required:
      - event_id
      - event_date
      properties:
        event_id:
          type: string
          format: uuid
        event_date:
          type: string
          format: date-time
          description: Дата события (`historical_event_date`, если заполнена, иначе `created_at`).
    ChatResponse:
      type: object
      required:
      - answer
      - event_references
      properties:
        answer:
          type: string
          description: Ответ строго на основе контекста БД по клиенту.
        event_references:
          type: array
          items:
            $ref: '#/components/schemas/EventReference'
          description: Обязательные ссылки на даты событий; может быть пустым.
