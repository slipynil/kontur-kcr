  /api/v1/imports:
    post:
      tags:
      - Imports
      operationId: uploadImport
      summary: Загрузить Excel с выбором квартала
      description: Загрузить REGISTRY/SNAPSHOT. Квартал и дата среза указываются пользователем; дата файла/имя листа
        не назначают период.
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - selected_quarter
              - import_type
              - snapshot_date
              properties:
                file:
                  type: string
                  format: binary
                  description: Excel-файл `.xlsx`.
                selected_quarter:
                  type: string
                  pattern: ^\d{4}_Q[1-4]$
                  example: 2026_Q2
                import_type:
                  type: string
                  enum:
                  - REGISTRY
                  - SNAPSHOT
                snapshot_date:
                  type: string
                  format: date
      responses:
        '202':
          description: Файл принят в обработку.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '400':
          description: Файл не передан или не является `.xlsx`.
          content:
