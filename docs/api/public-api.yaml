openapi: 3.1.0
info:
  title: Контур КЦР — Публичное API (внешний контур)
  version: 1.8.0
  summary: Единое внешнее API системы «Контур КЦР» через Gateway / Identity Service.
  description: 'Актуальные правила — spec.md 1.8 и ADR-0002 (уточнения пользователя от 05.11.2026).

    Квартал выбирается пользователем при загрузке; дата файла и имя листа не назначают его автоматически.

    Периоды только квартальные. Непереданные документы учитываются в следующих кварталах под исходным периодом без
    двойного счёта.

    Два квартала непрерывной задержки и более — LONG_DELAY_2Q.

    WAIT_DEADLINE с ещё не наступившей датой оператора сохраняет ответственного, включая новый квартал.

    По наступлении даты при остатке клиент доступен в POOL. Пустые поля наследуются с needs_review и происхождением.

    Rollback только последнего пакета; удаление клиента очищает его работу; удаление квартала сохраняет остальные
    кварталы и общую историю.

    ИИ использует облачный API стороннего провайдера; конкретные функции отложены до отдельного обсуждения.


    Публичные операции требуют Bearer JWT; ADMIN управляет импортом/удалением, OPERATOR работает в пуле.


    Уточнения 07.11.2026: ADR-0003; удаление квартала сохраняет остальные кварталы и общую историю работы.


    ADR-0005: динамика сравнивает актуальные остатки разных кварталов, по умолчанию текущий календарный квартал
    Europe/Moscow и предыдущий. Внутреннее HTTP-чтение выключено до согласования авторизации; локальное включение
    CLIENTS_ENABLE_REGISTRY_READ=true.

    ADR-0006: rollback восстанавливает и данные, вручную удалённые после импорта. Локальные команды Clients не означают
    глобального завершения.

    ADR-0007: числовые диапазоны применяются только к выбранному quarter. Сервисная авторизация остаётся предложением.'
servers:
- url: https://{host}
  description: Единая внешняя точка входа (nginx → Gateway / Identity).
  variables:
    host:
      default: kcr.example.local
      description: Имя хоста окружения (тестовые данные, внешний контур недоступен из интернета).
tags:
- name: Auth
  description: Аутентификация. Обрабатывает Gateway / Identity Service.
- name: Users
  description: Управление пользователями и ролями. Только Admin. Gateway / Identity Service.
- name: Imports
  description: Импорт из Excel. Проксируется в Import Worker.
- name: Clients
  description: Реестр клиентов. Проксируется в Clients Service.
- name: OperatorWork
  description: Рабочее место оператора. Проксируется в Operator Work Service.
- name: Assistant
  description: Облачный ИИ; операции являются предложениями до согласования функций.
security:
- bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: Аутентификация
      description: Проверяет логин и пароль, выдаёт JWT и карточку пользователя.
      security: []
      x-roles:
      - ADMIN
      - OPERATOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: ivanov
              password: '********'
      responses:
        '200':
          description: Успешная аутентификация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Неверный логин или пароль.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_CREDENTIALS
                message: Неверный логин или пароль
  /api/v1/users:
    get:
      tags:
      - Users
      operationId: listUsers
      summary: Список пользователей
      description: Реестр пользователей с ролями. Только Admin (`spec.md` §3.1).
      x-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Список пользователей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Users
      operationId: createUser
      summary: Создать пользователя
      description: Создание учётной записи с ролью. Только Admin (`spec.md` §3.1).
      x-roles:
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            example:
              login: petrov
              password: '********'
              role: OPERATOR
      responses:
        '201':
          description: Пользователь создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Логин уже занят.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: LOGIN_ALREADY_EXISTS
                message: Логин уже занят
  /api/v1/imports/{batch_id}/rollback:
    post:
      tags:
      - Imports
      operationId: rollbackImport
      summary: Откатить последний пакет
      description: 'ADR-0006: Восстановить состояние затронутых клиентов до импорта, включая данные, вручную удалённые
        после пакета. Import проверяет глобальный последний пакет; Clients дополнительно проверяет локальный порядок.
        Gateway/Import добавляет requested_by из проверенного пользовательского контекста. Публичный успех допустим
        только после всех участников. Повтор operation_id безопасен; тот же ID с другим payload даёт 409. Восстановительные
        копии не выдаются Registry API; необратимое уничтожение undo не согласовано.'
      x-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Пакет откачен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
              example:
                id: 3f0b2a1e-8c4d-4c1a-9f2e-6b7d5a4c3e21
                uploaded_by: 11111111-1111-1111-1111-111111111111
                filename: reestr_2026_Q1.xlsx
                status: ROLLED_BACK
                total_rows: 1200
                success_count: 1180
                error_count: 20
                created_at: '2026-01-15T09:30:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: OPERATION_PAYLOAD_CONFLICT, IMPORT_NOT_LATEST, IMPORT_ORDER_UNKNOWN или конфликт состояния.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Некорректная команда.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Локальная транзакция отменена; повторить тот же operation_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCommand'
  /api/v1/clients:
    get:
      tags:
      - Clients
      operationId: listClients
      summary: Реестр клиентов
      description: 'ADR-0005: актуальные остатки выбранного quarter и предшествующего исходного квартала. Без quarter
        используется текущий календарный квартал Europe/Moscow; без одного из периодов dynamics=null. Сумма остатков
        и категория клиента учитывают все периоды независимо от лимита срезов. Выбранный quarter не скрывает другие
        кварталы клиента. Оба квартала и числа сравнения возвращаются явно.'
      x-roles:
      - ADMIN
      - OPERATOR
      parameters:
      - name: work_quarter
        in: query
        required: false
        description: Квартал обзвона. Для списка/карточки без фильтра используется последний цикл; лента без фильтра
          объединяет все циклы.
        schema:
          type: string
          pattern: ^\d{4}_Q[1-4]$
      - name: search
        in: query
        description: Буквальное вхождение в КЦР или ИНН, без учёта регистра. Символы % и _ не являются шаблонами.
        schema:
          type: string
          maxLength: 256
        example: '6671'
      - name: dynamics
        in: query
        description: Сравнение актуальных остатков разных исходных кварталов; без quarter применяется календарная
          пара по умолчанию.
        schema:
          $ref: '#/components/schemas/Dynamics'
        example: GROWING
      - name: duration
        in: query
        description: Длительность непередачи документов.
        schema:
          $ref: '#/components/schemas/Duration'
        example: REPEATED
      - name: tags
        in: query
        description: Признаки через запятую; клиент должен иметь все выбранные признаки.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        style: form
        explode: false
        example:
        - VIP
        - NOVICE
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: quarter
        in: query
        description: Квартал сравнения с предшествующим; по умолчанию текущий календарный квартал Europe/Moscow.
        schema:
          type: string
          pattern: ^\d{4}_Q[1-4]$
      - name: min_unsubmitted_documents
        in: query
        description: Минимум непереданных документов выбранного квартала, включительно. Без quarter используется
          нынешний календарный квартал Europe/Moscow. Нет периода или процент не определён — запись исключается
          соответствующим числовым фильтром.
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
      - name: max_unsubmitted_documents
        in: query
        description: Максимум непереданных документов выбранного квартала, включительно. Без quarter используется
          нынешний календарный квартал Europe/Moscow. Нет периода или процент не определён — запись исключается
          соответствующим числовым фильтром.
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
      - name: min_unsubmitted_percent
        in: query
        description: Минимум процента непереданных документов выбранного квартала, без округления. Без quarter используется
          нынешний календарный квартал Europe/Moscow. Нет периода или процент не определён — запись исключается
          соответствующим числовым фильтром.
        schema:
          type: number
          minimum: 0
          maximum: 100
      - name: max_unsubmitted_percent
        in: query
        description: Максимум процента непереданных документов выбранного квартала, без округления. Без quarter
          используется нынешний календарный квартал Europe/Moscow. Нет периода или процент не определён — запись
          исключается соответствующим числовым фильтром.
        schema:
          type: number
          minimum: 0
          maximum: 100
      responses:
        '200':
          description: Страница реестра.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientListResponse'
        '400':
          description: Некорректные или неподдерживаемые параметры запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'SERVICE_UNAVAILABLE: повторить позже; внутренние сведения БД не раскрываются.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/clients/{kcr_code}/snapshots/history:
    get:
      tags:
      - Clients
      operationId: listSnapshotHistory
      summary: Журнал изменения статуса передачи документов
      description: 'История наблюдений: limit/offset/total, свежие даты и исправления первыми. quarter ограничивает
        историю исходным периодом; без фильтра — все периоды. Между отдельными страницами новый импорт может изменить
        позиции.'
      x-roles:
      - ADMIN
      - OPERATOR
      parameters:
      - $ref: '#/components/parameters/KcrCode'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: quarter
        in: query
        description: Исходный квартал истории; без фильтра — все.
        schema:
          type: string
          pattern: ^\d{4}_Q[1-4]$
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 100000000
          default: 0
      responses:
        '200':
          description: Страница журнала изменений.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotHistoryResponse'
                required:
                - total
                - limit
                - offset
                properties:
                  total:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                    minimum: 0
                  offset:
                    type: integer
                    minimum: 0
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: Некорректные или неподдерживаемые параметры запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'SERVICE_UNAVAILABLE: повторить позже; внутренние сведения БД не раскрываются.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/clients/{kcr_code}/take:
    post:
      tags:
      - OperatorWork
      operationId: takeClient
      summary: Взять или перезакрепить клиента на себя
      description: |
        Свободный опубликованный клиент закрепляется сразу.
        Для занятого клиента создаётся уведомление ответственному на один час.
        Действующий WAIT_DEADLINE, смена назначения, чужой ожидающий запрос
        и исторический цикл дают 409.
      x-roles:
      - OPERATOR
      parameters:
      - $ref: '#/components/parameters/WorkQuarter'
      - $ref: '#/components/parameters/KcrCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakeRequest'
      responses:
        '200':
          description: Клиент закреплён за текущим оператором.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/TakeResponse'
                - $ref: '#/components/schemas/ReassignmentRequest'
        '202':
          description: Запрос ожидает решения ответственного.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReassignmentRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Конфликт состояния или действующий срок ожидания.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/reassignment-notifications:
    get:
      operationId: listReassignmentNotifications
      summary: Получить входящие и отправленные запросы
      x-roles: [OPERATOR]
      parameters:
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      - name: offset
        in: query
        schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Уведомления текущего оператора.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReassignmentRequest'
  /api/v1/reassignment-notifications/{request_id}/reject:
    post:
      operationId: rejectReassignment
      summary: Отказать в перезакреплении до истечения часа
      x-roles: [OPERATOR]
      parameters:
      - name: request_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      responses:
        '200':
          description: Запрос отклонён текущим получателем уведомления.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReassignmentRequest'
        '404':
          description: Запрос не найден или недоступен оператору.
        '409':
          description: Запрос уже завершён.
  /api/v1/clients/{kcr_code}:
    get:
      tags:
      - Clients
      operationId: getClientCard
      summary: Карточка клиента
      description: 'ADR-0005: актуальные остатки выбранного quarter и предшествующего исходного квартала. Без quarter
        используется текущий календарный квартал Europe/Moscow; без одного из периодов dynamics=null. Сумма остатков
        и категория клиента учитывают все периоды независимо от лимита срезов. Выбранный quarter не скрывает другие
        кварталы клиента. Оба квартала и числа сравнения возвращаются явно.'
      x-roles:
      - ADMIN
      - OPERATOR
      parameters:
      - name: work_quarter
        in: query
        required: false
        description: Квартал обзвона. Для списка/карточки без фильтра используется последний цикл; лента без фильтра
          объединяет все циклы.
        schema:
          type: string
          pattern: ^\d{4}_Q[1-4]$
      - $ref: '#/components/parameters/KcrCode'
      - name: quarter
        in: query
        description: Квартал сравнения с предшествующим; по умолчанию текущий календарный квартал Europe/Moscow.
        schema:
          type: string
          pattern: ^\d{4}_Q[1-4]$
      responses:
        '200':
          description: Карточка клиента.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCard'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: Некорректные или неподдерживаемые параметры запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'SERVICE_UNAVAILABLE: повторить позже; внутренние сведения БД не раскрываются.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteClient
      summary: Удалить клиента целиком
      description: 'ADR-0006: Удаление клиента очищает его рабочие данные. Удаление исходного квартала сохраняет
        остальные кварталы, профиль, теги и общую операторскую историю. Отсутствующий объект успешен с нулевыми
        счётчиками. Gateway/Import добавляет requested_by из проверенного пользовательского контекста. Публичный
        успех допустим только после всех участников. Повтор operation_id безопасен; тот же ID с другим payload даёт
        409. Восстановительные копии не выдаются Registry API; необратимое уничтожение undo не согласовано.'
      parameters:
      - name: kcr_code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Данные и связанная работа удалены; успех только после межсервисной очистки.
        '400':
          description: Некорректная команда.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: OPERATION_PAYLOAD_CONFLICT, IMPORT_NOT_LATEST, IMPORT_ORDER_UNKNOWN или конфликт состояния.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Локальная транзакция отменена; повторить тот же operation_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-roles:
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCommand'
  /api/v1/clients/{kcr_code}/events:
    get:
      tags:
      - OperatorWork
      operationId: listClientEvents
      summary: Лента событий клиента
      description: 'История взаимодействия (звонки, комментарии, письма, смены этапов,

        закрепления), свежие первыми (`spec.md` §3.3, §4.4). Включает события

        прошлых дат (`historical_event_date`).


        История обычно сохраняется, но удаляется вместе с явно удалёнными данными клиента/квартала и при последнем
        rollback.'
      x-roles:
      - ADMIN
      - OPERATOR
      parameters:
      - name: work_quarter
        in: query
        required: false
        description: Квартал обзвона. Для списка/карточки без фильтра используется последний цикл; лента без фильтра
          объединяет все циклы.
        schema:
          type: string
          pattern: ^\d{4}_Q[1-4]$
      - $ref: '#/components/parameters/KcrCode'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Страница ленты событий.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - OperatorWork
      operationId: createClientEvent
      summary: Добавить звонок или прошлый комментарий
      description: |
        Сохранить звонок по назначению из формы. После перезакрепления автор может
        записать факт звонка в текущем цикле, без изменения этапа и срока.
        Если назначение актуально, будущий срок ожидания применяется вместе со звонком.
        Прошлый комментарий хранит время события отдельно от времени записи.
        Назначение, этап и срок ожидания при этом сохраняются.
        Повтор с тем же request_id и данными возвращает сохранённое событие.
      x-roles:
      - ADMIN
      - OPERATOR
      parameters:
      - $ref: '#/components/parameters/KcrCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/CallEventCreate'
              - $ref: '#/components/schemas/HistoricalCommentCreate'
              discriminator:
                propertyName: event_type
                mapping:
                  CALL_RESULT: '#/components/schemas/CallEventCreate'
                  HISTORICAL_COMMENT: '#/components/schemas/HistoricalCommentCreate'
            example:
              event_type: CALL_RESULT
              work_quarter: 2026_Q1
              call_result: AGREEMENT
              promised_date: '2026-02-10'
              comment_text: Договорились передать оригиналы до 10 февраля
      responses:
        '200':
          description: Событие уже было сохранено.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SavedCallEvent'
                - $ref: '#/components/schemas/SavedHistoricalComment'
        '201':
          description: Событие сохранено. Для звонка в ответе также есть wait_applied.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SavedCallEvent'
                - $ref: '#/components/schemas/SavedHistoricalComment'
        '403':
          description: Запись доступна только оператору.
        '404':
          description: Клиент недоступен.
        '409':
          description: Конфликт ID запроса, назначения или квартального цикла.
        '422':
          description: Некорректные данные, дата события или дата ожидания.

